  deep:ex('Почему биссектрисы углов при боковой стороне трапеции пересекаются под прямым углом?','∠A + ∠B = 180° (односторонние). Половины: 90°. В треугольнике AFB ∠F = 180° − 90° = 90°.')+mist(['Используют то, что нужно доказать, как известный факт.','Ссылаются на рисунок вместо обоснования.'])}
];

OGE.register({
  id:'math', name:'Математика', time:235, max:31,
  intro:'25 заданий: часть 1 — задания 1–19 (по 1 баллу), часть 2 — задания 20–25 (по 2 балла). Нужен хотя бы 2 балла за геометрию (15–19, 23–25).',
  geomNums:[15,16,17,18,19,23,24,25],
  scale:[[0,7,2],[8,14,3],[15,21,4],[22,31,5]],
  grade(score, byN){ let geo=0; [15,16,17,18,19,23,24,25].forEach(n=>geo+=(byN[n]||0)); let m=score<=7?2:score<=14?3:score<=21?4:5; let note='Баллов за геометрию: '+geo+'.'; if(m>2 && geo<2){ m=2; note+=' Меньше 2 баллов за геометрию — по правилам ставится «2».'; } return {mark:m, note}; },
  mini:[6,7,8,9,10,13,15,16,17,18], miniTime:35,
  sharedCtx:[1,2,3,4,5],
  lines, topics
});
})();

</script>
<script>
/* ОГЭ-9 · Информатика */
(function(){
'use strict';
const {fmt, frac, svg, line, text, esc} = OGE;

const box = (t,b)=>'<div class="rule"><div class="rule-t">'+t+'</div>'+b+'</div>';
const ex = (q,a)=>'<div class="example"><div class="ex-q">'+q+'</div><div class="ex-a">'+a+'</div></div>';
const mist = list=>'<div class="mistakes"><div class="rule-t">Типичные ошибки</div><ul>'+list.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
const code = s=>'<pre class="code">'+esc(s)+'</pre>';
const L_ = 'АБВГДЕЖЗИКЛМН'.split('');

const lines=[]; const L=(n,title,topic,pts,gen)=>lines.push({n,title,topic,pts,gen});

/* 1. Объём информации */
const LISTS=[
 ['животные',['кот','лось','бобр','олень','барсук','ёж','медведь','кабан','заяц','косуля','рысь','волк','лиса','енот','росомаха']],
 ['реки',['Обь','Нева','Волга','Лена','Енисей','Амур','Ока','Кама','Иртыш','Дон','Печора','Урал','Ангара','Селенга']],
 ['города',['Омск','Тверь','Москва','Казань','Самара','Курск','Псков','Пенза','Иркутск','Норильск','Ярославль','Владимир','Сочи','Чита']],
 ['планеты',['Марс','Земля','Венера','Сатурн','Юпитер','Уран','Нептун','Меркурий']],
 ['птицы',['чиж','грач','дятел','сова','снегирь','синица','ласточка','скворец','воробей','кукушка','журавль']],
 ['музыкальные инструменты',['арфа','баян','гитара','флейта','скрипка','труба','кларнет','барабан','балалайка','виолончель']]
];
L(1,'Информационный объём текста','code',1,(r)=>{
  if(r.chance(0.45)){
    let P,S,C,B,bytes; do{ P=r.pick([8,16,24,32,48,64]); S=r.pick([32,40,48,64]); C=r.pick([32,40,48,64]); B=r.pick([8,16]); bytes=P*S*C*B/8; }while(bytes%1024!==0);
    const pl=OGE.plural; return {text:'<p>Статья, набранная на компьютере, содержит '+P+' '+pl(P,'страницу','страницы','страниц')+', на каждой странице '+S+' '+pl(S,'строка','строки','строк')+', в каждой строке '+C+' '+pl(C,'символ','символа','символов')+'. Определите информационный объём статьи в килобайтах в кодировке, в которой каждый символ кодируется '+B+' битами.</p>', ans:fmt(bytes/1024),
      hint:'Объём = страницы × строки × символы × бит на символ. 1 байт = 8 бит, 1 Кбайт = 1024 байт.', sol:P+' · '+S+' · '+C+' = '+(P*S*C)+' символов. '+(P*S*C)+' · '+B+' бит = '+(P*S*C*B)+' бит = '+bytes+' байт = '+bytes+' / 1024 = '+fmt(bytes/1024)+' Кбайт.'}; }
  const [cat,words]=r.pick(LISTS); let list, w, bits, n;
  for(let tries=0;tries<50;tries++){ list=r.sample(words,r.int(6,8)); const lens=list.map(x=>x.length); const uniq=list.filter(x=>lens.filter(l=>l===x.length).length===1); if(uniq.length){ w=r.pick(uniq); break; } }
  bits=r.pick([8,16]); n=(w.length+2)*bits/8;
  const sentence=list.join(', ')+' — '+cat+'.';
  return {text:'<p>В кодировке '+(bits===8?'КОИ-8':'UTF-16')+' каждый символ кодируется '+bits+' битами. Ученик написал текст (в нём нет лишних пробелов):</p><p class="quote">«'+sentence+'»</p><p>Ученик вычеркнул из списка одно из названий, а также лишние запятую и пробел — два пробела не должны идти подряд. При этом размер нового предложения оказался на '+n+' байт меньше, чем размер исходного. Напишите в ответе вычеркнутое название.</p>',
    kind:'str', ans:w, hint:'Вместе со словом удалили 2 символа: запятую и пробел. Один символ = '+(bits/8)+' байт.',
    sol:'Удалено '+n+' байт = '+n+' / '+(bits/8)+' = '+(n*8/bits)+' символов. Из них 2 — запятая и пробел, значит, в слове '+(n*8/bits-2)+' букв. Такое слово в списке одно: «'+w+'».'};
});

/* 2. Декодирование */
const WORDS2=['КОТ','НОРА','ТАРА','РОТА','КАРТА','ТОРТ','ОКНО','АТОМ','МАК','РАК','КОМАР','НАТА','МОРКА'];
L(2,'Декодирование сообщения','code',1,(r)=>{
  const word=r.pick(WORDS2); const letters=[...new Set(word.split(''))]; const extra=r.sample('БВГДЕИЛПСУ'.split(''),r.int(1,2)); const all=r.shuffle(letters.concat(extra));
  // префиксный код
  let codes=['•','−']; while(codes.length<all.length){ const i=r.int(0,codes.length-1); const c=codes.splice(i,1)[0]; codes.push(c+'•',c+'−'); }
  codes=r.shuffle(codes); const map={}; all.forEach((l,i)=>map[l]=codes[i]);
  const msg=word.split('').map(l=>map[l]).join('');
  return {text:'<p>От разведчика было получено сообщение:</p><p class="quote mono">'+msg+'</p><p>В этом сообщении зашифрован пароль — последовательность русских букв. В пароле использовались только буквы из таблицы, каждая буква кодировалась своим кодом. Разделителей между кодами нет. Расшифруйте сообщение и запишите пароль.</p><table class="mini mono"><tr>'+all.map(l=>'<th>'+l+'</th>').join('')+'</tr><tr>'+all.map(l=>'<td>'+map[l]+'</td>').join('')+'</tr></table>',
    kind:'str', ans:word, hint:'Читай сообщение слева направо: на каждом шаге подходит ровно один код — ни один код не является началом другого.',
    sol:'Разбиваем: '+word.split('').map(l=>map[l]+' → '+l).join(', ')+'. Пароль: '+word+'.'};
});

/* 3. Логика */
L(3,'Логические выражения','logic',1,(r)=>{
  const a=r.int(3,40), b=a+r.int(3,25);
  const atoms=[
    {s:'X &lt; '+a, n:'X ≥ '+a, f:x=>x<a},{s:'X &gt; '+a, n:'X ≤ '+a, f:x=>x>a},{s:'X &lt; '+b, n:'X ≥ '+b, f:x=>x<b},{s:'X &gt; '+b, n:'X ≤ '+b, f:x=>x>b},
    {s:'X чётное', n:'X нечётное', f:x=>x%2===0},{s:'X нечётное', n:'X чётное', f:x=>x%2===1},{s:'X ≥ '+a, n:'X &lt; '+a, f:x=>x>=a},{s:'X ≤ '+b, n:'X &gt; '+b, f:x=>x<=b}
  ];
  for(let tries=0;tries<200;tries++){
    const p=r.pick(atoms), q=r.pick(atoms); if(p===q) continue;
    const np=r.chance(0.5), nq=r.chance(0.4), op=r.chance(0.75)?'И':'ИЛИ';
    const P=x=>np?!p.f(x):p.f(x), Q=x=>nq?!q.f(x):q.f(x); const F=x=> op==='И'? P(x)&&Q(x) : P(x)||Q(x);
    const sols=[]; for(let x=1;x<=300;x++) if(F(x)) sols.push(x);
    if(!sols.length||sols.length>250) continue;
    const wantMax = sols[sols.length-1]<250 && r.chance(0.5); const ansV=wantMax?sols[sols.length-1]:sols[0];
    if(ansV===1 && !wantMax && r.chance(0.7)) continue;
    const expr=(np?'НЕ ('+p.s+')':'('+p.s+')')+' '+op+' '+(nq?'НЕ ('+q.s+')':'('+q.s+')');
    return {text:'<p>Напишите '+(wantMax?'наибольшее':'наименьшее')+' натуральное число X, для которого истинно высказывание:</p><p class="quote mono">'+expr+'</p>', ans:fmt(ansV),
      hint:'Сначала замени «НЕ (X &lt; a)» на «X ≥ a» и т. п. Для «И» нужны обе части сразу, для «ИЛИ» — хотя бы одна.',
      sol:'Упрощаем: '+(np?'НЕ ('+p.s+') ⇔ '+p.n:p.s)+'; '+(nq?'НЕ ('+q.s+') ⇔ '+q.n:q.s)+'. Нужно, чтобы '+(op==='И'?'выполнялись оба условия':'выполнялось хотя бы одно условие')+': '+(np?p.n:p.s)+' '+(op==='И'?'и':'или')+' '+(nq?q.n:q.s)+'. Подходят натуральные числа '+(sols.length<=8?sols.join(', '):sols.slice(0,3).join(', ')+', …, '+sols.slice(-2).join(', '))+'. '+(wantMax?'Наибольшее':'Наименьшее')+': '+ansV+'.'};
  }
  return {text:'<p>Напишите наименьшее натуральное число X, для которого истинно высказывание: НЕ (X &lt; 7) И (X нечётное).</p>', ans:'7', hint:'НЕ (X &lt; 7) — это X ≥ 7.', sol:'X ≥ 7 и нечётное: 7.'};
});

/* 4. Кратчайший путь по таблице */
L(4,'Кратчайший путь по таблице','models',1,(r)=>{
  const n=r.int(5,6); const names=['A','B','C','D','E','F'].slice(0,n); let M, best;
  for(let tries=0;tries<300;tries++){
    M=names.map(()=>names.map(()=>0));
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) if(r.chance(0.55)){ M[i][j]=M[j][i]=r.int(1,9); }
    M[0][n-1]=M[n-1][0]= r.chance(0.5)?0:r.int(12,20);
    // Дейкстра
    const d=Array(n).fill(Infinity), used=Array(n).fill(false), prev=Array(n).fill(-1); d[0]=0;
    for(let k=0;k<n;k++){ let u=-1; for(let i=0;i<n;i++) if(!used[i]&&(u<0||d[i]<d[u])) u=i; if(d[u]===Infinity) break; used[u]=true; for(let v=0;v<n;v++) if(M[u][v]&&d[u]+M[u][v]<d[v]){ d[v]=d[u]+M[u][v]; prev[v]=u; } }
    if(d[n-1]===Infinity) continue; const path=[]; for(let v=n-1;v>=0;v=prev[v]) path.unshift(names[v]); if(path.length<3) continue;
    best={len:d[n-1],path}; break;
  }
  const tbl='<table class="mini mono"><tr><th></th>'+names.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+names.map((x,i)=>'<tr><th>'+x+'</th>'+names.map((y,j)=>'<td>'+(i===j?'':(M[i][j]||''))+'</td>').join('')+'</tr>').join('')+'</table>';
  return {text:'<p>Между населёнными пунктами '+names.join(', ')+' построены дороги, протяжённость которых (в километрах) приведена в таблице. Пустая клетка означает, что прямой дороги нет.</p>'+tbl+'<p>Определите длину кратчайшего пути между пунктами A и '+names[n-1]+', передвигаться можно только по дорогам из таблицы.</p>', ans:fmt(best.len),
    hint:'Нарисуй граф по таблице. Иди от A, записывая у каждого пункта наименьшее найденное расстояние.',
    sol:'Кратчайший путь: '+best.path.join(' → ')+', его длина '+best.len+' км. Прямая дорога '+(M[0][n-1]?'есть, но она длиннее ('+M[0][n-1]+' км)':'отсутствует')+'.'};
});

/* 5. Исполнитель */
L(5,'Исполнитель с неизвестным параметром','algo',1,(r)=>{
  for(let tries=0;tries<300;tries++){
    const t=r.int(0,2); const b=r.int(2,9); const x=r.int(1,12); const prog=Array.from({length:5},()=>r.pick(['1','2'])).join(''); if(!/2.*2/.test(prog)) continue;
    const cmds = t===0? {c1:'прибавь 1',f1:v=>v+1,c2:'умножь на b',f2:(v,b)=>v*b} : t===1? {c1:'вычти 1',f1:v=>v-1,c2:'умножь на b',f2:(v,b)=>v*b} : {c1:'прибавь b',f1:null,c2:'умножь на 2',f2:null};
    const run=bb=>{ let v=x; for(const c of prog){ if(t<2) v = c==='1'? cmds.f1(v) : cmds.f2(v,bb); else v = c==='1'? v+bb : v*2; } return v; };
    const y=run(b); const all=[]; for(let bb=2;bb<=40;bb++) if(run(bb)===y) all.push(bb); if(all.length!==1||y>5000) continue;
    const nm=r.pick(['Альфа','Вычислитель','Квадратор','Бета']);
    let trace=''; let v=x; for(const c of prog){ const nv = t<2? (c==='1'? cmds.f1(v):cmds.f2(v,b)) : (c==='1'? v+b : v*2); trace+=v+' → '+nv+' ('+c+'), '; v=nv; }
    return {text:'<p>У исполнителя '+nm+' две команды, которым присвоены номера:</p><p class="quote">1. '+cmds.c1+'<br>2. '+cmds.c2+'</p><p>(b — неизвестное натуральное число; b ≥ 2.) Выполняя первую из них, '+nm+' '+(t===0?'увеличивает число на экране на 1':t===1?'уменьшает число на экране на 1':'увеличивает число на b')+', а выполняя вторую, '+(t<2?'умножает это число на b':'умножает это число на 2')+'. Программа для исполнителя — это последовательность номеров команд. Известно, что программа '+prog+' переводит число '+x+' в число '+y+'. Определите значение b.</p>', ans:fmt(b),
      hint:'Перебери b = 2, 3, 4… и выполни программу для каждого. Или составь выражение с b и реши уравнение.',
      sol:'При b = '+b+': '+trace.replace(/, $/,'')+'. Получили '+y+'. Другие значения b не подходят. Ответ: '+b+'.'};
  }
});

/* 6. Программа и запуски */
L(6,'Анализ программы: сколько YES','prog',1,(r)=>{
  const A=r.int(2,12), B=r.int(2,12); const op=r.pick(['or','and']); const cs=r.pick(['>','<']), ct=r.pick(['>','<']);
  const pairs=Array.from({length:9},()=>[r.int(-3,15),r.int(-3,15)]);
  const cmp=(v,c,k)=>c==='>'?v>k:v<k;
  const ok=pairs.filter(([s,t])=> op==='or'? (cmp(s,cs,A)||cmp(t,ct,B)) : (cmp(s,cs,A)&&cmp(t,ct,B)) ).length;
  const py='s = int(input())\nt = int(input())\nif s '+cs+' '+A+' '+op+' t '+ct+' '+B+':\n    print("YES")\nelse:\n    print("NO")';
  const pas='var s, t: integer;\nbegin\n  readln(s);\n  readln(t);\n  if (s '+cs+' '+A+') '+op+' (t '+ct+' '+B+')\n    then writeln(\'YES\')\n    else writeln(\'NO\')\nend.';
  return {text:'<p>Ниже приведена программа на двух языках.</p><div class="two-code"><div><div class="code-lbl">Python</div>'+code(py)+'</div><div><div class="code-lbl">Паскаль</div>'+code(pas)+'</div></div><p>Было проведено 9 запусков программы, при которых в качестве значений s и t вводились пары чисел:</p><p class="quote mono">'+pairs.map(p=>'('+p[0]+', '+p[1]+')').join('; ')+'</p><p>Сколько было запусков, при которых программа напечатала «YES»?</p>', ans:fmt(ok),
    hint:op==='or'?'«or» — достаточно, чтобы выполнилось хотя бы одно условие.':'«and» — должны выполниться оба условия.',
    sol:'Проверяем каждую пару: '+pairs.map(([s,t])=>'('+s+', '+t+') — '+((op==='or'?(cmp(s,cs,A)||cmp(t,ct,B)):(cmp(s,cs,A)&&cmp(t,ct,B)))?'YES':'NO')).join('; ')+'. Всего YES: '+ok+'.'};
});

/* 7. Адрес файла */
L(7,'Адрес файла в интернете','net',1,(r)=>{
  const proto=r.pick(['http','https','ftp']), host=r.pick(['school','info','news','edu','city','shop','map']), dom=r.pick(['.ru','.com','.org','.net']), file=r.pick(['test','task','data','plan','home','report']), ext=r.pick(['.html','.txt','.doc','.png','.pdf']);
  if(host===file) return OGE.bySubj.inf.lineByN[7].gen(r);
  const parts=[proto,'://',host,dom,'/',file,ext]; const sh=r.shuffle(parts.map((p,i)=>i)); const letters=L_.slice(0,7);
  const ans=parts.map((p,i)=>letters[sh.indexOf(i)]).join('');
  return {text:'<p>Доступ к файлу <b>'+file+ext+'</b>, находящемуся на сервере <b>'+host+dom+'</b>, осуществляется по протоколу <b>'+proto+'</b>. Фрагменты адреса файла закодированы буквами от А до Ж. Запишите последовательность этих букв, кодирующую адрес указанного файла.</p><p class="quote mono">'+sh.map((i,k)=>letters[k]+') '+parts[i]).join('&nbsp;&nbsp; ')+'</p>', kind:'seq', ans,
    hint:'Адрес строится так: протокол :// сервер / файл.', sol:'Адрес: '+parts.join('')+'. Буквы по порядку: '+ans+'.'};
});

/* 8. Поисковые запросы */
L(8,'Поисковые запросы и круги Эйлера','net',1,(r)=>{
  const pair=r.pick([['Крейсер','Линкор'],['Фрегат','Эсминец'],['Пушкин','Лермонтов'],['Лето','Осень'],['Кошки','Собаки'],['Байкал','Ладога']]);
  const A=r.int(20,80)*100, B=r.int(20,80)*100, AB=r.int(2,Math.min(A,B)/100-1)*100; const U=A+B-AB;
  const t=r.int(0,2); const rows=[[pair[0]+' | '+pair[1],U],[pair[0],A],[pair[1],B],[pair[0]+' &amp; '+pair[1],AB]];
  const ask=[2,3,0,1][t===0?r.int(0,1):t===1?2:3]; const shown=rows.filter((x,i)=>i!==ask);
  const tbl='<table class="mini"><tr><th>Запрос</th><th>Найдено страниц (в тысячах)</th></tr>'+shown.map(x=>'<tr><td class="mono">'+x[0]+'</td><td>'+fmt(x[1]/100)+'</td></tr>').join('')+'</table>';
  return {text:'<p>В языке запросов поискового сервера для обозначения логической операции «ИЛИ» используется символ «|», а для «И» — символ «&amp;». В таблице приведены запросы и количество найденных по ним страниц некоторого сегмента Интернета.</p>'+tbl+'<p>Какое количество страниц (в тысячах) будет найдено по запросу <b class="mono">'+rows[ask][0]+'</b>? Считается, что все запросы выполнялись практически одновременно.</p>', ans:fmt(rows[ask][1]/100),
    hint:'Формула: |A ИЛИ B| = |A| + |B| − |A И B|. Нарисуй два пересекающихся круга.',
    sol:'|'+pair[0]+' | '+pair[1]+'| = |'+pair[0]+'| + |'+pair[1]+'| − |'+pair[0]+' &amp; '+pair[1]+'|: '+fmt(U/100)+' = '+fmt(A/100)+' + '+fmt(B/100)+' − '+fmt(AB/100)+'. Отсюда искомое значение: '+fmt(rows[ask][1]/100)+'.'};
});

/* 9. Пути в графе */
L(9,'Количество путей в графе','models',1,(r)=>{
  for(let tries=0;tries<200;tries++){
    const cols=[1,r.int(2,3),r.int(2,3),r.int(2,3),1]; const nodes=[]; let k=0; const names='АБВГДЕЖЗИКЛМН'.split('');
    cols.forEach((c,ci)=>{ for(let j=0;j<c;j++) nodes.push({id:k,name:names[k++],col:ci,row:j,rows:c}); });
    const end=nodes[nodes.length-1]; end.name='К'; nodes[0].name='А';
    const edges=[];
    nodes.forEach(u=>{ nodes.forEach(v=>{ if(v.col===u.col+1 && r.chance(0.65)) edges.push([u.id,v.id]); else if(v.col===u.col+2 && r.chance(0.12)) edges.push([u.id,v.id]); else if(v.col===u.col && v.row===u.row+1 && r.chance(0.15)) edges.push([u.id,v.id]); }); });
    const outs=id=>edges.filter(e=>e[0]===id), ins=id=>edges.filter(e=>e[1]===id);
    if(nodes.some(n=>n.id!==end.id && !outs(n.id).length) || nodes.some(n=>n.id!==0 && !ins(n.id).length)) continue;
    // подсчёт путей (топологический порядок: по столбцам и строкам)
    const order=nodes.slice().sort((a,b)=>a.col-b.col||a.row-b.row); const cnt={}; cnt[0]=1;
    order.forEach(n=>{ if(n.id===0) return; cnt[n.id]=ins(n.id).reduce((s,e)=>s+(cnt[e[0]]||0),0); });
    const total=cnt[end.id]; if(total<4||total>40) continue;
    const W=440,H=200; const pos=n=>[30+n.col*(W-60)/4, H/2+(n.row-(n.rows-1)/2)*62];
    let g='<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker></defs>';
    edges.forEach(([a,b])=>{ const p=pos(nodes[a]), q=pos(nodes[b]); const dx=q[0]-p[0], dy=q[1]-p[1], L2=Math.hypot(dx,dy); g+='<line x1="'+(p[0]+dx/L2*14).toFixed(1)+'" y1="'+(p[1]+dy/L2*14).toFixed(1)+'" x2="'+(q[0]-dx/L2*15).toFixed(1)+'" y2="'+(q[1]-dy/L2*15).toFixed(1)+'" class="s-ink" marker-end="url(#arr)"/>'; });
    nodes.forEach(n=>{ const p=pos(n); g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="13" class="s-ink f-paper"/>'+text(p[0],p[1]+5,n.name,'t-ink'); });
    return {text:'<p>На рисунке — схема дорог, связывающих города. По каждой дороге можно двигаться только в одном направлении, указанном стрелкой. Сколько существует различных путей из города А в город К?</p>'+svg(W,H,g,'Граф дорог'), ans:fmt(total),
      hint:'Для каждого города число путей = сумма путей во все города, из которых в него ведут стрелки. Начни с А = 1.',
      sol:order.filter(n=>n.id!==0).map(n=>n.name+' = '+(ins(n.id).map(e=>nodes[e[0]].name).join(' + '))+' = '+cnt[n.id]).join('; ')+'. Ответ: '+total+'.'};
  }
});

/* 10. Системы счисления */
L(10,'Системы счисления','base',1,(r)=>{
  const vals=[]; while(vals.length<3){ const v=r.int(17,250); if(vals.every(x=>Math.abs(x-v)>2)) vals.push(v); }
  const bases=r.shuffle([2,8,16]); const max=r.chance(0.7);
  const ans=max?Math.max(...vals):Math.min(...vals);
  const show=(v,b)=>v.toString(b).toUpperCase()+'<sub>'+b+'</sub>';
  return {text:'<p>Среди приведённых ниже трёх чисел, записанных в различных системах счисления, найдите '+(max?'максимальное':'минимальное')+' и запишите его в ответе в десятичной системе счисления. В ответе запишите только число, основание системы счисления указывать не нужно.</p><p class="quote mono">'+vals.map((v,i)=>show(v,bases[i])).join(',&nbsp;&nbsp; ')+'</p>', ans:fmt(ans),
    hint:'Переведи каждое число в десятичную систему: цифру умножай на основание в степени её позиции (справа, с нуля).',
    sol:vals.map((v,i)=>show(v,bases[i])+' = '+v.toString(bases[i]).toUpperCase().split('').reverse().map((d,k)=>parseInt(d,16)+'·'+bases[i]+(k?'<sup>'+k+'</sup>':'⁰')).reverse().join(' + ')+' = '+v).join('<br>')+'<br>'+(max?'Максимальное':'Минимальное')+': '+ans+'.'};
});

    hint:'Ищи по редкому слову: по названию места или по году. Затем проверь, что совпали и место, и год.', sol:'Поиск по «'+target.y+'» и «'+target.p+'» находит строку: «Экспедиция на '+target.p+' в '+target.y+' году. Руководитель — '+target.nm+' '+target.sn+'». Ответ: '+target.sn+'.'};

/* 12. Файловая система */
L(12,'Файлы и каталоги','files',1,(r)=>{
  const exts=['.txt','.docx','.png','.jpg','.mp3','.pdf','.odt'];
  const fnames=['отчёт','план','фото','заметки','список','песня','схема','доклад','конспект','таблица','рисунок','письмо'];
  let id=0;
  function mk(depth,name){ const node={name,files:[],dirs:[]}; const nf=r.int(2,5); for(let i=0;i<nf;i++){ node.files.push(r.pick(fnames)+'_'+(++id)+r.pick(exts)); } if(depth<2){ const nd=r.int(1,3); for(let i=0;i<nd;i++) node.dirs.push(mk(depth+1, r.pick(['Учёба','Музыка','Фото','Проекты','Документы','Лето','Школа','Разное','Кружок','Архив'])+(depth+1)+(i+1))); } return node; }
  const root=mk(0,'Диск'); const target=r.chance(0.5)? root : r.pick(root.dirs); const ext=r.pick(exts);
  const count=n=>n.files.filter(f=>f.endsWith(ext)).length+n.dirs.reduce((s,d)=>s+count(d),0);
  const ans=count(target);
  const render=(n,open)=>'<details'+(open?' open':'')+'><summary class="fs-dir">'+esc(n.name)+'</summary><ul class="fs-tree">'+n.dirs.map(d=>'<li>'+render(d,false)+'</li>').join('')+n.files.map(f=>'<li class="fs-f">'+esc(f)+'</li>').join('')+'</ul></details>';
  return {text:'<p>Ниже показано содержимое каталога. Раскрывай вложенные папки щелчком. Сколько файлов с расширением <b class="mono">'+ext+'</b> содержится в каталоге <b>'+esc(target.name)+'</b> вместе со всеми его подкаталогами?</p><div class="fs-wrap">'+render(root,true)+'</div>', ans:fmt(ans),
    hint:'Открой все вложенные папки — файлы внутри подкаталогов тоже считаются.', sol:'Считаем файлы '+ext+' в «'+esc(target.name)+'» и всех вложенных папках: всего '+ans+'.'};
});

L(16,'Программирование: обработка последовательности','prog',2,(r)=>{

    kind:'tests', tests, ans:tests.map(t=>t.out).join(' / '),
    hint:'Заведи счётчик (или сумму, или максимум) до цикла. В цикле читай число и проверяй условие через остаток от деления %.',
    sol:'<p>Решение на Python:</p>'+code(T.py(k,dg))+'<p>Ответы на тестах: '+tests.map(t=>'['+t.inp.join(', ')+'] → '+t.out).join('; ')+'.</p>'};
});

 {title:'Сосна на обрыве', s:[

function topoCtx(cr){
  const scale=cr.pick([50,100,200]); const names=cr.shuffle(['школа','родник','церковь','мельница','мост','колодец','памятник']);
  for(let tries=0;tries<500;tries++){
    const A=[cr.int(2,7),cr.int(1,5)];
    const dv=cr.pick([[3,4],[4,3],[-3,4],[-4,3],[3,-4],[-3,-4],[4,-3],[-4,-3],[0,3],[0,-3],[4,0],[-4,0],[5,0],[0,4]]);
    const rv=cr.pick([[2,2],[-2,2],[2,-2],[-2,-2],[3,3],[-3,3],[0,2],[0,-2],[3,0],[-3,0],[1,1],[-1,-1]]);
    const xv=[cr.int(-5,5),cr.int(-4,4)], yv=[cr.int(-5,5),cr.int(-4,4)];
    const all=[[0,0],dv,rv,xv,yv]; const P=all.map(v=>[A[0]+v[0],A[1]+v[1]]);
    if(P.some(p=>p[0]<1||p[0]>9||p[1]<1||p[1]>6)) continue;
    if(P.some((p,i)=>P.some((q,j)=>i<j && Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])<2))) continue;
    if(xv[0]*rv[1]===xv[1]*rv[0] || yv[0]*rv[1]===yv[1]*rv[0]) continue; // декоры не на той же линии направления
    const objs=[{n:'точка A',p:A}]; const dist={n:names[0],p:P[1],v:dv}, dir={n:names[1],p:P[2],v:rv};
    objs.push(dist,dir,{n:names[2],p:P[3],v:xv},{n:names[3],p:P[4],v:yv});
    return {scale,objs,A,dist,dir};
  }
}
function topoSvg(o){

  for(let x=0;x<=W;x++) g+=line(pad+x*c,pad,pad+x*c,pad+H*c,'s-grid');
  for(let y=0;y<=H;y++) g+=line(pad,pad+y*c,pad+W*c,pad+y*c,'s-grid');
  o.objs.forEach(ob=>{ const X=pad+ob.p[0]*c, Y=pad+ob.p[1]*c; g+='<circle cx="'+X+'" cy="'+Y+'" r="5" class="f-ink"/>'+'<text x="'+(X+8)+'" y="'+(Y-8)+'" class="t-map">'+ob.n+'</text>'; });
  g+='<path d="M'+(pad+W*c-18)+','+(pad+40)+' l0,-28 l-6,10 m6,-10 l6,10" class="s-ink"/>'+text(pad+W*c-18,pad+52,'С','t-small');
  return svg(W*c+pad*2,H*c+pad*2+22,g+text(pad+W*c/2,pad+H*c+18,'Масштаб: в 1 сантиметре '+o.scale+' метров (сторона клетки — 1 см)','t-small'),'Фрагмент топографической карты');
}
function synCtx(cr){
  const H=[cr.int(170,210),cr.int(70,100)], Bc=[cr.int(330,385),cr.int(80,150)];
  const ang=cr.pick([215,225,235,245])*Math.PI/180;
  const fr=[0,1,2,3,4,5,6].map(i=>[H[0]+Math.cos(ang)*i*26, H[1]-Math.sin(ang)*i*26]);
  const inC=[H[0]+cr.int(-22,22), H[1]+cr.int(-26,-14)]; const nearF=[fr[6][0]+cr.int(-4,4)+14, fr[6][1]-cr.int(2,8)];
  const inA=[Bc[0]+cr.sign()*cr.int(22,30), Bc[1]+cr.sign()*cr.int(10,16)]; const far=[cr.int(300,380), cr.int(222,238)];
  const pts=cr.shuffle([['C',inC],['F',nearF],['A',inA],['X',far]]);
  return {H,Bc,fr,pts};
}

  return svg(W,Hh,g,'Синоптическая карта');
}
function climSvg(c){
  const W=330,H=200,l=40,b=170,t=16,w=(W-l-30)/12; let g='';
  const pmax=200; const tmin=-40,tmax=30; const py=v=>b-(v/pmax)*(b-t); const ty=v=>b-((v-tmin)/(tmax-tmin))*(b-t);
  for(let v=-40;v<=30;v+=10){ g+=line(l,ty(v),W-30,ty(v),'s-grid'); g+=text(l-6,ty(v)+4,fmt(v),'t-tiny','end'); }
  [0,50,100,150,200].forEach(v=>g+=text(W-26,py(v)+4,v,'t-tiny','start'));
  c.p.forEach((v,i)=>{ g+='<rect x="'+(l+i*w+3).toFixed(1)+'" y="'+py(v).toFixed(1)+'" width="'+(w-6).toFixed(1)+'" height="'+(b-py(v)).toFixed(1)+'" class="f-rain"/>'; });
  g+='<polyline points="'+c.t.map((v,i)=>(l+i*w+w/2).toFixed(1)+','+ty(v).toFixed(1)).join(' ')+'" class="s-temp"/>';
  'ЯФМАМИИАСОНД'.split('').forEach((m,i)=>g+=text(l+i*w+w/2,b+14,m,'t-tiny'));
  g+=line(l,b,W-30,b,'s-axis'); g+=text(l-6,10,'t, °C','t-tiny','end'); g+=text(W-26,10,'мм','t-tiny','start');
  return svg(W,H,g,'Климатограмма');
}
function profileCtx(r){
  const n=r.int(2,3); const pts=[[0,r.int(120,150)]]; let prev=pts[0][1];
  const kind=r.pick(['hill','valley']);
  for(let i=1;i<=n;i++){ const up = (kind==='hill')? (i%2===1) : (i%2===0); const v=up? prev+r.int(2,4)*10 : prev-r.int(2,4)*10; pts.push([i/(n+1)+r.next()*0.08-0.04,Math.max(100,Math.min(200,v))]); prev=pts[pts.length-1][1]; }
  pts.push([1,prev+r.int(-1,1)*10]);

  intro:'30 заданий: 27 с кратким ответом (по 1 баллу), 3 с развёрнутым ответом (12 — 2 балла, 29 и 30 — по 1 баллу). На экзамене разрешены атласы 7–9 классов и линейка.',
  scale:[[0,11,2],[12,18,3],[19,25,4],[26,31,5]],
  grade(score){ return {mark: score<=11?2:score<=18?3:score<=25?4:5, note:''}; },
  mini:[1,2,7,9,10,13,17,19,23,24,26], miniTime:30,
  sharedCtx:[5,6,9,10,23,24,28,29],
  lines, topics
});
})();

</script>
<script>
/* ОГЭ-9 · интерфейс */
(function(){
'use strict';
const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc = OGE.esc; const fmt = OGE.fmt;
const SUBJ = OGE.subjects;
const VARIANTS = {math:'6 900', inf:'5 300', rus:'2 800', geo:'8 500'};
const PTS = n => n+' '+OGE.plural(n,'балл','балла','баллов');

/* ---------- хранилище ---------- */
const KEY='oge9-progress-v1';
let st = {log:[], err:{}, exams:[], exam:null};
try { const raw = localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); if(o && typeof o==='object') st=Object.assign(st,o); } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }

/* ---------- статистика ---------- */
function topicStats(subj){
  const m={}; st.log.filter(x=>x.s===subj).forEach(x=>{ const k=x.t; m[k]=m[k]||{ok:0,all:0}; m[k].all++; if(x.ok) m[k].ok++; }); return m;
}
function numStats(subj){ const m={}; st.log.filter(x=>x.s===subj).forEach(x=>{ m[x.n]=m[x.n]||{ok:0,all:0}; m[x.n].all++; if(x.ok) m[x.n].ok++; }); return m; }
function subjStats(subj){ const l=st.log.filter(x=>x.s===subj); return {all:l.length, ok:l.filter(x=>x.ok).length}; }
const openErrors = subj => Object.values(st.err).filter(e=>!e.fixed && (!subj||e.s===subj));
function weakTopics(limit){
  const out=[]; SUBJ.forEach(s=>{ const ts=topicStats(s.id); s.topics.forEach(t=>{ const x=ts[t.id]; if(x && x.all>=2 && x.ok/x.all<0.7) out.push({s:s.id,t:t.id,title:t.title,rate:x.ok/x.all,all:x.all}); }); });
  return out.sort((a,b)=>a.rate-b.rate).slice(0,limit||99);
}
function logResult(task, score, max, blank){
  const ok = score===max;
  st.log.push({s:task.subj,n:task.n,t:task.topic,ok,ts:Date.now()});
  if(st.log.length>4000) st.log=st.log.slice(-4000);
  const key=task.subj+'|'+task.n+'|'+task.seed+'|'+task.ctx;
  if(!ok && !blank){ st.err[key]={s:task.subj,n:task.n,seed:task.seed,ctx:task.ctx,t:task.topic,ts:Date.now(),fixed:false,score,max}; }
  else if(st.err[key]){ st.err[key].fixed=true; }
  save();
}

/* ---------- состояние интерфейса ---------- */
let view = {name:'home'};
let prac = null;   // текущее задание в режиме подготовки
let menuOpen = false;
const isPhone = () => { try { return window.matchMedia('(max-width: 760px)').matches; } catch(e){ return false; } };
let timerId = null;
const randSeed = () => 1+Math.floor(Math.random()*999999);

function go(v){ view=v; menuOpen=false; render(); const m=$('#main'); if(m) m.scrollTop=0; window.scrollTo(0,0); }

/* ---------- компоненты ---------- */
function blankInput(id, val, wide, dis){
  return '<div class="blank'+(wide?' blank-wide':'')+'"><input id="'+id+'" class="blank-in" type="text" autocomplete="off" spellcheck="false" maxlength="'+(wide?24:17)+'" value="'+esc(val||'')+'" aria-label="Ответ"'+(dis?' disabled':'')+'></div>';
}
function answerUI(t, val, locked){
  const dis = locked?' disabled':'';
  if(t.kind==='self'){
    return (t.listen? listenUI(t):'') + (t.write? '<label class="lbl" for="ans-text">Твой ответ</label><textarea id="ans-text" class="essay" rows="'+(t.n===12?4:10)+'" placeholder="Пиши здесь или на листе бумаги"'+dis+'>'+esc((val&&val.text)||'')+'</textarea><div class="wc" id="wc">'+wordCount((val&&val.text)||'')+'</div>' : '<p class="note">Реши на листе бумаги, затем открой образец и оцени себя.</p>');
  }
  if(t.kind==='multi') return '<div class="multi">'+t.fields.map((f,i)=>'<div class="mf"><label for="ans-'+i+'">'+f.lbl+'</label>'+blankInput('ans-'+i,(val||[])[i],false,locked)+'</div>').join('')+'</div>';
  if(t.kind==='tests') return '<table class="mini tests"><tr><th>Тест</th><th>Входные данные</th><th>Что вывела твоя программа</th></tr>'+t.tests.map((x,i)=>'<tr><td>'+(i+1)+'</td><td class="mono">'+x.inp.length+'<br>'+x.inp.join('<br>')+'</td><td><input id="ans-'+i+'" class="plain-in" value="'+esc((val||[])[i]||'')+'" aria-label="Вывод на тесте '+(i+1)+'"'+dis+'></td></tr>').join('')+'</table>';
  if(t.kind==='robot') return '<label class="lbl" for="ans-code">Программа для Робота</label><textarea id="ans-code" class="code-in" rows="9" spellcheck="false" placeholder="нц пока ...&#10;  закрасить&#10;  вправо&#10;кц"'+dis+'>'+esc((val&&val.code)||'')+'</textarea><div class="row-btn"><button class="btn ghost" data-act="robot-run">Запустить на примере</button></div><div id="robot-out"></div>';
  if(t.kind==='kw') return '<label class="lbl" for="ans">Ответ</label><input id="ans" class="plain-in wide" value="'+esc(val||'')+'" autocomplete="off"'+dis+'>';
  return '<label class="lbl" for="ans">Ответ в бланк</label>'+blankInput('ans', val, t.kind==='numset', locked);
}
function listenUI(t){
  const tts = ('speechSynthesis' in window);
  return '<div class="listen"><div class="listen-row">'+(tts?'<button class="btn" data-act="listen">Прослушать текст</button>':'')+'<button class="btn ghost" data-act="peek">Прочитать текст (2 минуты)</button><span class="listen-st" id="listen-st"></span></div><div class="peek" id="peek" hidden><div class="rtext-t">'+esc(t.listenTitle||'')+'</div>'+t.listen.split('\n\n').map(p=>'<p>'+esc(p)+'</p>').join('')+'</div><p class="note">На экзамене текст прослушивают дважды. Делай заметки в черновике по абзацам.</p></div>';
}
const wordCount = s => { const n=(String(s).match(/[A-Za-zА-Яа-яЁё0-9-]+/g)||[]).length; return 'Слов: '+n+(n<70?' (нужно не меньше 70)':''); };

function readAnswer(t){
  if(t.kind==='multi'||t.kind==='tests'){ const n = t.kind==='multi'? t.fields.length : t.tests.length; return Array.from({length:n},(_,i)=>{ const e=$('#ans-'+i); return e? e.value : ''; }); }
  if(t.kind==='robot'){ const e=$('#ans-code'); return {code: e? e.value:''}; }
  if(t.kind==='self'){ const e=$('#ans-text'); return {text: e? e.value:''}; }
  const e=$('#ans'); return e? e.value : '';
}
function showAns(t, v){
  if(v==null) return '—';
  if(t.kind==='multi'||t.kind==='tests') return v.map(x=>esc(x||'—')).join(' / ');
  if(t.kind==='robot') return v.code? '<pre class="code small">'+esc(v.code)+'</pre>' : '—';
  if(t.kind==='self') return v.text? esc(v.text.slice(0,140))+(v.text.length>140?'…':'') : '—';
  return String(v).trim()? esc(v) : '—';
}

function splitWrap(ctx, body){
  const tab=view.splitTab||'task';
  return '<div class="split-tabs" role="tablist"><button role="tab" aria-selected="'+(tab==='task')+'" class="'+(tab==='task'?'on':'')+'" data-act="split-tab" data-v="task">Задание</button><button role="tab" aria-selected="'+(tab==='text')+'" class="'+(tab==='text'?'on':'')+'" data-act="split-tab" data-v="text">Текст</button></div><div class="split show-'+tab+'"><div class="split-l">'+ctx+'</div><article class="task card">'+body+'</article></div>';
}
function ctxBlock(t, open){
  if(!t.ctxIntro) return '';
  if(t.ctxKey==='text') return '<details class="ctx ctx-text"'+(open?' open':'')+'><summary>Текст для заданий</summary>'+t.ctxIntro+'</details>';
  return '<div class="ctx">'+t.ctxIntro+'</div>';
}
function taskHead(t, label){
  const s=OGE.bySubj[t.subj]; const top=s.topicById[t.topic];
  return '<header class="task-h"><span class="tnum">'+(label||('№ '+(t.n===99?'ГК':t.n)))+'</span><span class="ttl">'+esc(t.lineTitle)+'</span><span class="chip">'+esc(top?top.title:'')+'</span><span class="pts">'+PTS(t.pts)+'</span></header>';
}

function criteriaUI(t, prefix, chosen){
  const crit = t.criteria || [{k:'',name:'Оценка',levels:t.rubric}];
  return '<div class="criteria">'+crit.map((c,ci)=>'<fieldset class="crit"><legend>'+(c.k?'<b>'+c.k+'</b> ':'')+esc(c.name)+'</legend>'+c.levels.map(l=>'<label class="lvl"><input type="radio" name="'+prefix+'-'+ci+'" value="'+l.v+'"'+((chosen&&chosen[ci]===l.v)?' checked':'')+'> <span class="lvl-v">'+l.v+'</span> <span>'+esc(l.d)+'</span></label>').join('')+'</fieldset>').join('')+'</div>';
}
function critMax(t){ const crit=t.criteria||[{levels:t.rubric}]; return crit.reduce((s,c)=>s+Math.max(...c.levels.map(l=>l.v)),0); }
function readCriteria(t, prefix){ const crit=t.criteria||[{levels:t.rubric}]; const arr=crit.map((c,ci)=>{ const e=$('input[name="'+prefix+'-'+ci+'"]:checked'); return e? +e.value : null; }); return arr; }

function verdict(ok, partial, text){
  return '<div class="verdict '+(ok?'v-ok':partial?'v-part':'v-bad')+'" role="status"><span class="pen">'+(ok?'Верно!':partial?'Частично':'Ошибка')+'</span><span>'+text+'</span></div>';
}
function robotRuns(r){
  if(r.error) return '<p class="err-msg">'+esc(r.error)+'</p>';
  return '<div class="runs">'+r.runs.map((x,i)=>'<figure class="run"><figcaption>Поле '+(i+1)+': '+(x.st.err? '<span class="bad">'+esc(x.st.err)+'</span>' : x.ok? '<span class="good">всё верно</span>' : '<span class="bad">не закрашено '+x.missing+', лишних '+x.extra+'</span>')+'</figcaption>'+OGE.robotSvg(x.field,x.st,true)+'</figure>').join('')+'</div><p class="note">Жёлтые клетки нужно закрасить, зелёные — закрашены верно, красные — лишние.</p>';
}

/* ---------- макет ---------- */
function sidebar(){
  const cur = view.subj;
  const errN = openErrors().length;
  return '<aside class="side'+(menuOpen?' open':'')+'" aria-label="Навигация"><div class="side-top"><button class="logo" data-go="home"><span class="logo-m">ОГЭ</span><span class="logo-s">9 класс · 2026</span></button><button class="menu-btn" data-act="menu" aria-expanded="'+menuOpen+'" aria-controls="side-nav">'+(menuOpen?'Закрыть':'Меню')+(errN&&!menuOpen?'<span class="nav-badge">'+errN+'</span>':'')+'</button></div><nav class="side-nav" id="side-nav">'+
    '<button class="nav-i'+(view.name==='home'?' on':'')+'" data-go="home">Главная</button>'+
    '<div class="nav-cap">Предметы</div>'+
    SUBJ.map(s=>{ const x=subjStats(s.id); return '<button class="nav-i nav-s'+(cur===s.id&&view.name==='subj'?' on':'')+'" data-subj="'+s.id+'" data-go="subj" style="--sc:var(--c-'+s.id+')"><span class="dot"></span>'+s.name+(x.all?'<span class="nav-n">'+Math.round(x.ok/x.all*100)+'%</span>':'')+'</button>'; }).join('')+
    '<div class="nav-cap">Мой прогресс</div>'+
    '<button class="nav-i'+(view.name==='errors'?' on':'')+'" data-go="errors">Работа над ошибками'+(errN?'<span class="nav-badge">'+errN+'</span>':'')+'</button>'+
    '<button class="nav-i'+(view.name==='stats'?' on':'')+'" data-go="stats">Статистика</button>'+
    '</nav><p class="side-foot">Прогресс сохраняется в этом браузере на этом компьютере.</p></aside>';
}
function render(){
  if(timerId && !(view.name==='subj' && view.tab==='exam' && st.exam && !st.exam.done)){ clearInterval(timerId); timerId=null; }
  const app=$('#app');
  let main='';
  if(view.name==='home') main=homeView();
  else if(view.name==='subj') main=subjView();
  else if(view.name==='errors') main=errorsView();
  else if(view.name==='stats') main=statsView();
  else if(view.name==='review') main=reviewView();
  app.innerHTML = sidebar()+'<main id="main" class="main" data-subj="'+(view.subj||'')+'">'+main+'</main>';
  afterRender();
}

/* ---------- главная ---------- */
function homeView(){
  const ex = st.exam && !st.exam.done ? st.exam : null;
  const weak = weakTopics(5); const errN=openErrors().length;
  const total=st.log.length, okc=st.log.filter(x=>x.ok).length;
  return '<section class="hero"><div><h1>Подготовка к ОГЭ</h1><p class="lead">Математика, информатика, русский язык и география по структуре ОГЭ-2026. Задания генерируются заново, у каждого есть подсказка и разбор.</p></div>'+
   '<div class="hero-stat"><div class="hs"><b>'+total+'</b><span>решено заданий</span></div><div class="hs"><b>'+(total?Math.round(okc/total*100)+'%':'—')+'</b><span>верных ответов</span></div><div class="hs"><b>'+errN+'</b><span>ошибок на разбор</span></div></div></section>'+
   (ex? '<div class="banner"><span>Незаконченный экзамен: '+OGE.bySubj[ex.subj].name+', '+(ex.mode==='full'?'полный вариант':'мини-вариант')+'.</span><button class="btn" data-act="resume-exam">Продолжить</button></div>':'')+
   '<section class="modes"><div class="mode"><span class="mode-n">1</span><h3>Изучение</h3><p>Краткая теория по каждой теме, формулы, схемы и разбор примеров.</p></div><div class="mode"><span class="mode-n">2</span><h3>Подготовка</h3><p>Задания по темам и номерам: подсказка до решения, разбор после ответа.</p></div><div class="mode"><span class="mode-n">3</span><h3>Проверка</h3><p>Вариант как на экзамене: таймер, бланк ответов, баллы и оценка по шкале ФИПИ.</p></div></section>'+
   '<section class="subjects">'+SUBJ.map(s=>{ const x=subjStats(s.id); const pct=x.all?Math.round(x.ok/x.all*100):0; const last=st.exams.filter(e=>e.s===s.id).slice(-1)[0];
     return '<article class="scard" style="--sc:var(--c-'+s.id+')"><div class="scard-top"><h2>'+s.name+'</h2><span class="meta">'+s.lines.filter(l=>!l.examOnly).length+' номеров · '+Math.floor(s.time/60)+' ч '+(s.time%60)+' мин · '+PTS(s.max)+'</span></div>'+
     '<p class="scard-p">'+s.intro+'</p><div class="scard-bar" aria-label="Доля верных ответов"><i style="width:'+pct+'%"></i></div><p class="scard-m">'+(x.all? 'Решено '+x.all+', верно '+pct+'%' : 'Ещё не начато')+(last? ' · последний экзамен: «'+last.mark+'»':'')+' · более '+VARIANTS[s.id]+' вариантов заданий</p>'+
     '<div class="scard-btns"><button class="btn ghost" data-go="subj" data-subj="'+s.id+'" data-tab="learn">Изучать</button><button class="btn ghost" data-go="subj" data-subj="'+s.id+'" data-tab="practice">Тренироваться</button><button class="btn" data-go="subj" data-subj="'+s.id+'" data-tab="exam">Экзамен</button></div></article>'; }).join('')+'</section>'+
   '<section class="panel"><h2 class="h2">Слабые темы</h2>'+(weak.length? '<ul class="weak">'+weak.map(w=>'<li><span class="dot" style="--sc:var(--c-'+w.s+')"></span><span>'+OGE.bySubj[w.s].name+': '+esc(w.title)+'</span><span class="rate">'+Math.round(w.rate*100)+'%</span><button class="btn small ghost" data-act="weak-go" data-s="'+w.s+'" data-t="'+w.t+'">Разобрать</button></li>').join('')+'</ul>' : '<p class="muted">Здесь появятся темы, где больше всего ошибок. Реши хотя бы несколько заданий по каждой теме.</p>')+'</section>';
}

/* ---------- предмет ---------- */
function subjView(){
  const s=OGE.bySubj[view.subj]; const tab=view.tab||'learn';
  const tabs=[['learn','Изучение'],['practice','Подготовка'],['exam','Экзамен']];
  let body='';
  if(tab==='learn') body=learnView(s); else if(tab==='practice') body=practiceView(s); else body=examView(s);
  return '<header class="sub-h"><div><h1>'+s.name+'</h1><p class="muted">'+s.intro+'</p></div></header><div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" aria-selected="'+(tab===t[0])+'" class="tab'+(tab===t[0]?' on':'')+'" data-go="subj" data-subj="'+s.id+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+body;
}

function learnView(s){
  const tid=view.topic||s.topics[0].id; const t=s.topicById[tid]; const ts=topicStats(s.id);
  return '<div class="learn"><nav class="tlist" aria-label="Темы">'+s.topics.map(x=>{ const v=ts[x.id]; const nums=x.nums.filter(n=>!s.lineByN[n].examOnly);
    return '<button class="titem'+(x.id===tid?' on':'')+'" data-act="topic" data-t="'+x.id+'"><span class="tnums">'+(nums.length?'№ '+nums.join(', '):'')+'</span><span class="tt">'+esc(x.title)+'</span>'+(v?'<span class="tpct '+(v.ok/v.all<0.6?'low':'')+'">'+Math.round(v.ok/v.all*100)+'%</span>':'')+'</button>'; }).join('')+'</nav>'+
    '<article class="tcontent"><h2 class="h2">'+esc(t.title)+'</h2><p class="muted">Задания экзамена: '+(t.nums.filter(n=>!s.lineByN[n].examOnly).map(n=>'№ '+n).join(', ')||'оценивается в экзамене')+'</p><h3 class="h3">Коротко</h3>'+t.theory+'<h3 class="h3">Подробный разбор</h3>'+t.deep+
    (t.nums.some(n=>!s.lineByN[n].examOnly)?'<div class="row-btn"><button class="btn" data-act="practice-topic" data-t="'+t.id+'">Тренироваться по теме</button></div>':'')+'</article></div>';
}

/* --- подготовка --- */
function newPractice(s, opts){
  opts=opts||{};
  let n, seed, ctx;
  if(opts.queue && opts.queue.length){ const q=opts.queue.shift(); n=q.n; seed=q.seed; ctx=q.ctx; }
  else {
    let pool=s.lines.filter(l=>!l.examOnly);
    if(opts.topics && opts.topics.length) pool=pool.filter(l=>opts.topics.includes(l.topic));
    if(opts.n) pool=pool.filter(l=>l.n===opts.n);
    n=pool[Math.floor(Math.random()*pool.length)].n; seed=randSeed(); ctx=seed;
  }
  const task=OGE.make(s.id,n,seed,ctx);
  view.splitTab='task';
  prac={subj:s.id, task, user:null, done:false, res:null, hint:false, sol:false, opts, selfScore:null};
}
function practiceView(s){
  const o = view.popts || {};
  if(!prac || prac.subj!==s.id) newPractice(s,o);
  const ns=numStats(s.id);
  const topicChips = s.topics.filter(t=>t.nums.some(n=>!s.lineByN[n].examOnly)).map(t=>'<button class="pchip'+((o.topics||[]).includes(t.id)?' on':'')+'" data-act="pf-topic" data-t="'+t.id+'">'+esc(t.title)+'</button>').join('');
  const numGrid = s.lines.filter(l=>!l.examOnly).map(l=>{ const x=ns[l.n]; const cls= !x?'' : x.ok/x.all>=0.8?'g': x.ok/x.all>=0.5?'y':'r'; return '<button class="ncell '+cls+(o.n===l.n?' on':'')+'" data-act="pf-num" data-n="'+l.n+'" title="'+esc(l.title)+(x?' · верно '+x.ok+' из '+x.all:'')+'">'+l.n+'</button>'; }).join('');
  const qinfo = o.queue && o.queue.length ? '<span class="chip warn">В очереди ошибок: '+o.queue.length+'</span>' : '';
  const selTxt = o.n? 'задание № '+o.n : (o.topics&&o.topics.length)? o.topics.map(id=>s.topicById[id].title).join(', ') : 'все задания';
  return '<div class="prac"><details class="pfilter-d"'+(isPhone()?'':' open')+'><summary><span>Что решаем:</span> <b>'+esc(selTxt)+'</b></summary><div class="pfilter"><div class="pf-row"><span class="pf-l">Темы</span><div class="pchips"><button class="pchip'+(!(o.topics||[]).length&&!o.n?' on':'')+'" data-act="pf-all">Все задания</button>'+topicChips+'</div></div><div class="pf-row"><span class="pf-l">Номер</span><div class="ngrid">'+numGrid+'</div></div><p class="muted small">Цвет номера — доля верных ответов: зелёный — от 80%, жёлтый — от 50%, красный — меньше. '+qinfo+'</p></div></details>'+practiceCard()+'</div>';
}
function practiceCard(){
  const t=prac.task; const split = t.ctxKey==='text';
  let fb='';
  if(prac.done){
    if(t.kind==='self'){
      fb = prac.selfScore==null ? '<div class="selfbox"><h3 class="h3">Самопроверка</h3><p class="muted">Сравни свой ответ с образцом и выбери баллы по каждому критерию.</p>'+criteriaUI(t,'pc')+'<div class="row-btn"><button class="btn" data-act="self-save">Сохранить оценку</button></div></div>'
        : verdict(prac.selfScore===t.pts, prac.selfScore>0, 'Твоя оценка: '+prac.selfScore+' из '+t.pts+'.');
    } else {
      const r=prac.res; const ok=r.score===r.max;
      fb = verdict(ok, r.score>0 && !ok, ok? 'Ответ '+showAns(t,prac.user)+' совпадает с правильным.' : 'Твой ответ: '+showAns(t,prac.user)+'. Правильный: <b>'+esc(t.ans)+'</b>.'+(t.kind==='multi'||t.kind==='tests'?' Баллы: '+r.score+' из '+r.max+'.':''))+(r.robot? robotRuns(r.robot):'');
    }
  }
  const body = taskHead(t)+(split?'':ctxBlock(t))+'<div class="task-text">'+t.text+'</div>'+
    '<div class="answer">'+answerUI(t, prac.user, prac.done && t.kind!=='self')+'</div>'+
    '<div class="actions">'+(!prac.done? '<button class="btn" data-act="check">'+(t.kind==='self'?'Показать образец':'Проверить')+'</button>':'')+
      '<button class="btn ghost" data-act="hint"'+(prac.hint?' aria-pressed="true"':'')+'>Подсказка</button>'+
      (prac.done? '<button class="btn ghost" data-act="sol">'+(prac.sol?'Скрыть решение':'Решение')+'</button>':'<button class="btn ghost" data-act="giveup">Не знаю, покажи решение</button>')+
      '<button class="btn '+(prac.done?'':'ghost ')+'next" data-act="next">Следующее задание</button></div>'+
    (prac.hint?'<div class="hintbox"><b>Подсказка.</b> '+t.hint+'</div>':'')+fb+
    ((prac.done&&prac.sol) || (prac.done && t.kind==='self')? '<div class="solbox"><h3 class="h3">Решение</h3>'+t.sol+'</div>':'');
  return split? splitWrap(t.ctxIntro, body) : '<article class="task card">'+body+'</article>';
}

/* --- экзамен --- */
function examLines(s, mode){ return mode==='full'? s.lines.filter(l=>l.n!==99).map(l=>l.n) : s.mini; }
function startExam(s, mode){
  const vs=randSeed(); const seeds={}; const lines=s.lines.map(l=>l.n).filter(n=> mode==='full' || s.mini.includes(n));
  lines.forEach(n=>seeds[n]=randSeed());
  st.exam={subj:s.id, mode, vs, seeds, nums:examLines(s,mode), answers:{}, cur:examLines(s,mode)[0], start:Date.now(), limit:(mode==='full'?s.time:s.miniTime)*60, done:false, self:{}, stage:'run'};
  save(); view={name:'subj',subj:s.id,tab:'exam'}; render();
}
const examTask = (ex,n) => OGE.make(ex.subj, n, ex.seeds[n], (OGE.bySubj[ex.subj].sharedCtx||[]).includes(n)? ex.vs : null);
function examView(s){
  const ex=st.exam;
  if(ex && ex.subj===s.id && !ex.done) return examRun(s,ex);
  if(ex && ex.subj===s.id && ex.done) return examResult(s,ex);
  const other = ex && !ex.done ? '<div class="banner warn">Идёт экзамен по предмету «'+OGE.bySubj[ex.subj].name+'». Начав новый, ты его прервёшь.</div>' : '';
  const last=st.exams.filter(e=>e.s===s.id).slice(-5).reverse();
  return other+'<div class="exam-setup"><article class="card ex-opt"><h2 class="h2">Полный вариант</h2><p>'+s.lines.filter(l=>l.n!==99).length+' заданий, '+Math.floor(s.time/60)+' ч '+(s.time%60)+' мин, максимум '+PTS(s.max)+'. Порядок и формат — как в КИМ ОГЭ-2026.</p><button class="btn" data-act="start-exam" data-mode="full">Начать полный вариант</button></article>'+
    '<article class="card ex-opt"><h2 class="h2">Мини-вариант</h2><p>'+s.mini.length+' заданий за '+s.miniTime+' минут: номера '+s.mini.join(', ')+'. Удобно для ежедневной проверки.</p><button class="btn ghost" data-act="start-exam" data-mode="mini">Начать мини-вариант</button></article></div>'+
    '<section class="panel"><h2 class="h2">Шкала перевода баллов в оценку</h2>'+scaleBar(s,null)+'<p class="muted small">Шкала по рекомендациям ФИПИ на 2026 год; регион может её скорректировать.'+(s.id==='math'?' Для оценки «3» и выше нужно не меньше 2 баллов за геометрию.':s.id==='rus'?' Для «4» нужно не меньше 6 баллов за грамотность, для «5» — не меньше 9.':'')+'</p></section>'+
    (last.length? '<section class="panel"><h2 class="h2">Последние попытки</h2><table class="mini"><tr><th>Дата</th><th>Вариант</th><th>Баллы</th><th>Оценка</th></tr>'+last.map(e=>'<tr><td>'+new Date(e.ts).toLocaleDateString('ru-RU')+'</td><td>'+(e.mode==='full'?'полный':'мини')+'</td><td>'+e.score+' из '+e.max+'</td><td><b>'+e.mark+'</b>'+(e.mode==='mini'?' (ориентир.)':'')+'</td></tr>').join('')+'</table></section>':'');
}
function scaleBar(s, score){
  const max=s.max; return '<div class="scale">'+s.scale.map(([a,b,m])=>'<div class="sc-seg m'+m+'" style="flex:'+(b-a+1)+'"><b>«'+m+'»</b><span>'+a+'–'+b+'</span></div>').join('')+(score!=null?'<div class="sc-mark" style="left:'+Math.min(100,(score+0.5)/(max+1)*100)+'%"><span>'+score+'</span></div>':'')+'</div>';
}
function examRun(s,ex){
  const left = Math.max(0, ex.limit - Math.floor((Date.now()-ex.start)/1000));
  const t=examTask(ex,ex.cur); const val=ex.answers[ex.cur];
  const answered=n=>{ const v=ex.answers[n]; if(v==null) return false; if(typeof v==='string') return v.trim()!==''; if(Array.isArray(v)) return v.some(x=>x&&String(x).trim()); if(v.code) return v.code.trim()!==''; if(v.text!=null) return v.text.trim()!=='' || v.done; return false; };
  const idx=ex.nums.indexOf(ex.cur);
  const split = t.ctxKey==='text';
  const confirm = view.confirm ? '<div class="confirm" role="alertdialog" aria-label="Завершить экзамен"><p>Завершить экзамен? Без ответа осталось заданий: '+ex.nums.filter(n=>!answered(n)).length+'.</p><button class="btn" data-act="finish-exam">Да, завершить</button><button class="btn ghost" data-act="cancel-finish">Вернуться к заданиям</button></div>' : '';
  const card = taskHead(t,'Задание '+t.n)+(split?'':ctxBlock(t))+'<div class="task-text">'+t.text+'</div><div class="answer">'+answerUI(t,val,false)+'</div>'+
    (t.kind==='self'?'<p class="note">Это задание ты оценишь сам после завершения экзамена по критериям.</p>':'')+
    '<div class="actions"><button class="btn ghost" data-act="ex-prev"'+(idx===0?' disabled':'')+'>Назад</button><button class="btn" data-act="ex-next">'+(idx===ex.nums.length-1?'Сохранить':'Сохранить и дальше')+'</button></div>';
  return '<div class="exam-bar"><div class="ex-title">'+(ex.mode==='full'?'Полный вариант':'Мини-вариант')+'</div><div class="timer'+(left<600?' low':'')+'" id="timer" aria-live="off">'+clock(left)+'</div><button class="btn danger" data-act="ask-finish">Завершить</button></div>'+confirm+
    '<nav class="exnav" aria-label="Задания варианта">'+ex.nums.map(n=>'<button class="xcell'+(n===ex.cur?' on':'')+(answered(n)?' done':'')+'" data-act="ex-go" data-n="'+n+'">'+n+'</button>').join('')+'</nav>'+
    (split? splitWrap(t.ctxIntro, card) : '<article class="task card">'+card+'</article>');
}
const clock = sec => { const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); };
function storeExamAnswer(){
  const ex=st.exam; if(!ex||ex.done) return; const t=examTask(ex,ex.cur); ex.answers[ex.cur]=readAnswer(t); save();
}
function finishExam(){
  const ex=st.exam; storeExamAnswer(); ex.done=true; ex.end=Date.now(); ex.stage='self'; ex.score=null;
  const s=OGE.bySubj[ex.subj];
  const selfNums = ex.nums.filter(n=>examTask(ex,n).kind==='self').concat(ex.mode==='full' && s.lineByN[99]? [99]:[]);
  ex.selfNums=selfNums; if(!selfNums.length) computeExam(); save(); view.confirm=false; render();
}
function computeExam(){
  const ex=st.exam; const s=OGE.bySubj[ex.subj]; const byN={}; let score=0, max=0;
  const all = ex.nums.concat((ex.selfNums||[]).filter(n=>!ex.nums.includes(n)));
  all.forEach(n=>{ const t=examTask(ex,n); let sc;
    if(t.kind==='self') sc = ex.self[n]||0; else sc=OGE.check(t, ex.answers[n]).score;
    byN[n]=sc; score+=sc; max+=t.pts; });
  let mark, note;
  if(ex.mode==='full'){ const g=s.grade(score,byN); mark=g.mark; note=g.note; }
  else { const eq=Math.round(score/max*s.max); const seg=s.scale.find(x=>eq>=x[0]&&eq<=x[1]); mark=seg?seg[2]:2; note='Мини-вариант: оценка ориентировочная, пересчитана пропорционально полному варианту ('+eq+' из '+s.max+').'; }
  ex.byN=byN; ex.score=score; ex.max=max; ex.mark=mark; ex.note=note; ex.stage='result';
  // журнал и ошибки
  const isBlank=(t,v)=> t.kind!=='self' && (v==null || (typeof v==='string' && !v.trim()) || (Array.isArray(v) && !v.some(x=>x&&String(x).trim())) || (v.code!=null && !v.code.trim()));
  all.forEach(n=>{ const t=examTask(ex,n); logResult(t, byN[n], t.pts, isBlank(t,ex.answers[n])); });
  ex.blankN = all.filter(n=>isBlank(examTask(ex,n),ex.answers[n])).length;
  st.exams.push({s:ex.subj, mode:ex.mode, score, max, mark, ts:ex.end, dur:Math.round((ex.end-ex.start)/1000)});
  save();
}
function examResult(s,ex){
  if(ex.stage==='self'){
    return '<section class="panel"><h2 class="h2">Самопроверка развёрнутых ответов</h2><p class="muted">Эти задания на экзамене проверяют эксперты. Сравни свой ответ с образцом и честно выбери баллы по каждому критерию.</p></section>'+
      ex.selfNums.map(n=>{ const t=examTask(ex,n); const v=ex.answers[n];
        const mine = (n===99)? '' : (v&&v.text? '<div class="mine"><div class="rtext-t">Твой ответ</div><p>'+esc(v.text).replace(/\n/g,'<br>')+'</p><p class="muted small">'+wordCount(v.text)+'</p></div>' : (t.kind==='self'?'<p class="muted">Ответ в поле не записан — оцени работу, выполненную на листе.</p>':''));
        return '<article class="card task">'+taskHead(t, n===99?'Грамотность':'Задание '+n)+(n===99?'':'<div class="task-text">'+t.text+'</div>')+mine+'<details class="solbox"><summary>Образец и пояснения</summary>'+t.sol+'</details>'+criteriaUI(t,'x'+n, ex.selfCrit&&ex.selfCrit[n])+'</article>'; }).join('')+
      '<div class="row-btn"><button class="btn" data-act="self-done">Подсчитать результат</button></div>';
  }
  const rows = Object.keys(ex.byN).map(Number).sort((a,b)=>(a===99?13.5:a)-(b===99?13.5:b)).map(n=>{ const t=examTask(ex,n); const sc=ex.byN[n]; const ok=sc===t.pts;
    return '<tr class="'+(ok?'':'bad-row')+'"><td>'+(n===99?'ГК':n)+'</td><td>'+esc(t.lineTitle)+'</td><td>'+(t.kind==='self'?'самооценка':showAns(t,ex.answers[n]))+'</td><td>'+(t.kind==='self'?'—':esc(t.ans))+'</td><td class="sc">'+sc+'/'+t.pts+'</td><td><button class="btn small ghost" data-act="ex-sol" data-n="'+n+'">Разбор</button></td></tr>'+
      (view.exSol===n? '<tr class="sol-row"><td colspan="6"><div class="solbox">'+(t.ctxIntro && t.ctxKey!=='text'? t.ctxIntro:'')+'<div class="task-text">'+t.text+'</div><h3 class="h3">Решение</h3>'+t.sol+'</div></td></tr>':''); }).join('');
  const dur=Math.round((ex.end-ex.start)/60000);
  return '<section class="result card"><div class="res-mark m'+ex.mark+'"><span class="pen big">«'+ex.mark+'»</span></div><div class="res-info"><h2 class="h2">'+ex.score+' из '+ex.max+' первичных баллов</h2><p>'+(ex.mode==='full'?'Полный вариант':'Мини-вариант')+', время: '+dur+' мин из '+Math.round(ex.limit/60)+'.</p>'+(ex.note?'<p class="muted">'+ex.note+'</p>':'')+(ex.blankN?'<p class="muted">Без ответа: '+ex.blankN+' '+OGE.plural(ex.blankN,'задание','задания','заданий')+'. Они не попадают в список ошибок — реши их в режиме подготовки.</p>':'')+(ex.mode==='full'? scaleBar(s,ex.score):'')+'<div class="row-btn"><button class="btn" data-act="errors-subj" data-s="'+s.id+'">Разобрать ошибки</button><button class="btn ghost" data-act="new-exam">Новый вариант</button></div></div></section>'+
    '<section class="panel"><h2 class="h2">Ответы по заданиям</h2><div class="tablewrap"><table class="mini res-t"><tr><th>№</th><th>Задание</th><th>Твой ответ</th><th>Верный ответ</th><th>Баллы</th><th></th></tr>'+rows+'</table></div></section>';
}

/* ---------- ошибки ---------- */
function errorsView(){
  const f=view.filter||'all'; const list=openErrors(f==='all'?null:f).sort((a,b)=>b.ts-a.ts);
  const groups={}; list.forEach(e=>{ const k=e.s+'|'+e.t; (groups[k]=groups[k]||[]).push(e); });
  const sel=view.sel||[];

   '<div class="pchips"><button class="pchip'+(f==='all'?' on':'')+'" data-act="err-f" data-f="all">Все предметы</button>'+SUBJ.map(s=>'<button class="pchip'+(f===s.id?' on':'')+'" data-act="err-f" data-f="'+s.id+'">'+s.name+' ('+openErrors(s.id).length+')</button>').join('')+'</div>'+
   (list.length? '<div class="errgroups">'+Object.keys(groups).map(k=>{ const [s,t]=k.split('|'); const S=OGE.bySubj[s]; const top=S.topicById[t]; const es=groups[k]; const on=sel.includes(k);
     return '<article class="eg card'+(on?' on':'')+'" style="--sc:var(--c-'+s+')"><label class="eg-h"><input type="checkbox" data-act="err-sel" data-k="'+k+'"'+(on?' checked':'')+'> <span class="dot"></span><b>'+esc(top?top.title:t)+'</b><span class="muted">'+S.name+'</span><span class="nav-badge">'+es.length+'</span></label><ul class="eg-l">'+es.slice(0,6).map(e=>{ const tk=OGE.make(e.s,e.n,e.seed,e.ctx); return '<li><span>№ '+(e.n===99?'ГК':e.n)+' · '+esc(tk.lineTitle)+'</span><span class="muted small">'+new Date(e.ts).toLocaleDateString('ru-RU')+'</span>'+(tk.kind==='self'?'':'<button class="btn small ghost" data-act="err-retry" data-k="'+esc(e.s+'|'+e.n+'|'+e.seed+'|'+e.ctx)+'">Решить заново</button>')+'</li>'; }).join('')+(es.length>6?'<li class="muted">и ещё '+(es.length-6)+'</li>':'')+'</ul></article>'; }).join('')+'</div>'+
     '<div class="stickybar"><span>Выбрано тем: '+sel.length+'</span><button class="btn" data-act="err-review"'+(sel.length?'':' disabled')+'>Разобрать выбранные темы</button></div>'
   : '<div class="empty card"><p class="pen">Ошибок нет</p><p>Реши задания в режиме подготовки или пройди экзамен — неверные ответы появятся здесь.</p></div>');
}
function reviewView(){
  const keys=view.sel||[];
  return '<header class="sub-h"><div><h1>Разбор тем</h1><p class="muted">Прочитай разбор, посмотри примеры и типичные ошибки, затем реши задания: сначала те, где ты ошибся, потом новые.</p></div><button class="btn ghost" data-go="errors">К списку ошибок</button></header>'+
   keys.map(k=>{ const [s,t]=k.split('|'); const S=OGE.bySubj[s]; const top=S.topicById[t]; const n=openErrors(s).filter(e=>e.t===t).length;

       '<div class="row-btn"><button class="btn" data-act="review-practice" data-k="'+k+'">Тренироваться'+(n?': сначала '+n+' '+OGE.plural(n,'ошибка','ошибки','ошибок'):'')+'</button></div></article>'; }).join('');
}

/* ---------- статистика ---------- */
function statsView(){
  return '<header class="sub-h"><div><h1>Статистика</h1><p class="muted">Темы отсортированы от самых слабых к сильным. График показывает результаты экзаменов в процентах от максимума.</p></div></header>'+
   SUBJ.map(s=>{ const x=subjStats(s.id); const ts=topicStats(s.id); const ex=st.exams.filter(e=>e.s===s.id);
     const tops=s.topics.map(t=>({t, v:ts[t.id]})).filter(o=>o.v).sort((a,b)=>a.v.ok/a.v.all-b.v.ok/b.v.all);
     return '<section class="panel stat" style="--sc:var(--c-'+s.id+')"><div class="stat-h"><h2 class="h2"><span class="dot"></span>'+s.name+'</h2><span class="muted">Решено '+x.all+', верно '+(x.all?Math.round(x.ok/x.all*100)+'%':'—')+', экзаменов '+ex.length+'</span></div>'+
     '<div class="stat-g"><div>'+(tops.length? tops.map(o=>{ const p=Math.round(o.v.ok/o.v.all*100); return '<div class="bar-row"><span class="br-l">'+esc(o.t.title)+'</span><span class="br-b"><i class="'+(p<50?'r':p<80?'y':'g')+'" style="width:'+p+'%"></i></span><span class="br-v">'+p+'% <small>('+o.v.ok+'/'+o.v.all+')</small></span></div>'; }).join('') : '<p class="muted">Нет решённых заданий.</p>')+'</div><div>'+examChart(ex)+'</div></div></section>'; }).join('');
}
function examChart(ex){
  if(!ex.length) return '<p class="muted">Экзаменов пока не было.</p>';
  const W=320,H=160,l=34,b=130,t=14; const n=ex.length; const x=i=> n===1? (l+W-10)/2 : l+i*(W-l-14)/(n-1); const y=v=>b-v/100*(b-t);
  let g=''; [0,25,50,75,100].forEach(v=>{ g+='<line x1="'+l+'" y1="'+y(v)+'" x2="'+(W-8)+'" y2="'+y(v)+'" class="s-grid"/><text x="'+(l-6)+'" y="'+(y(v)+4)+'" class="t-tiny" text-anchor="end">'+v+'%</text>'; });
  const pts=ex.map((e,i)=>[x(i),y(Math.round(e.score/e.max*100))]);
  g+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" class="s-fn"/>';
  pts.forEach((p,i)=>{ g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" class="f-sc"/><text x="'+p[0]+'" y="'+(p[1]-8)+'" class="t-tiny" text-anchor="middle">'+ex[i].mark+'</text>'; });
  g+='<text x="'+l+'" y="'+(b+18)+'" class="t-tiny">первая попытка</text><text x="'+(W-8)+'" y="'+(b+18)+'" class="t-tiny" text-anchor="end">последняя</text>';
  return '<svg class="fig chart" viewBox="0 0 '+W+' '+(H+4)+'" width="'+W+'" role="img" aria-label="Результаты экзаменов">'+g+'</svg>';
}

/* ---------- после отрисовки ---------- */

/* ---------- действия ---------- */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-go],[data-act]'); if(!b) return;
  if(b.dataset.go){
    if(st.exam && !st.exam.done && view.name==='subj' && view.tab==='exam') storeExamAnswer();
    const v={name:b.dataset.go}; if(b.dataset.subj) v.subj=b.dataset.subj; if(b.dataset.tab) v.tab=b.dataset.tab; if(v.name==='subj' && !v.tab) v.tab='learn';
    if(v.name==='subj' && v.tab==='practice' && (!prac || prac.subj!==v.subj)) prac=null;
    go(v); return;
  }
  const act=b.dataset.act; const s=view.subj? OGE.bySubj[view.subj]:null;
  switch(act){
    case 'menu': menuOpen=!menuOpen; render(); break;
    case 'split-tab': if(view.tab==='exam') storeExamAnswer(); else if(prac && !prac.done) prac.user=readAnswer(prac.task); view.splitTab=b.dataset.v; render(); window.scrollTo(0,0); break;
    case 'topic': view.topic=b.dataset.t; render(); if(isPhone()){ const c=$('.tcontent'); if(c) c.scrollIntoView(); } break;
    case 'practice-topic': view={name:'subj',subj:s.id,tab:'practice',popts:{topics:[b.dataset.t]}}; prac=null; render(); break;
    case 'weak-go': view={name:'review',sel:[b.dataset.s+'|'+b.dataset.t]}; render(); break;
    case 'pf-all': view.popts={}; newPractice(s,{}); render(); break;
    case 'pf-topic': { const o=view.popts||{}; let ts=(o.topics||[]).slice(); const t=b.dataset.t; ts = ts.includes(t)? ts.filter(x=>x!==t) : ts.concat(t); view.popts={topics:ts}; newPractice(s,view.popts); render(); break; }
    case 'pf-num': { const n=+b.dataset.n; view.popts={n}; newPractice(s,view.popts); render(); break; }
    case 'hint': prac.hint=!prac.hint; prac.user=readAnswer(prac.task); render(); break;
    case 'check': case 'giveup': {
      const t=prac.task; prac.user=readAnswer(t);
      if(t.kind==='self'){ prac.done=true; render(); break; }
      prac.res=OGE.check(t,prac.user); prac.done=true; if(act==='giveup'){ prac.res.score=0; prac.sol=true; }
      logResult(t, prac.res.score, prac.res.max); if(act==='check' && prac.res.score!==prac.res.max) prac.sol=true; render(); break; }
    case 'self-save': { const t=prac.task; const arr=readCriteria(t,'pc'); if(arr.some(x=>x==null)){ const f=$('.criteria'); if(f) f.classList.add('need'); break; } prac.selfScore=arr.reduce((a,b)=>a+b,0); logResult(t, prac.selfScore, t.pts); render(); break; }
    case 'sol': prac.sol=!prac.sol; render(); break;
    case 'next': { const o=view.popts||{}; newPractice(s,o); render(); break; }
    case 'robot-run': { const t=prac&&view.tab==='practice'? prac.task : examTask(st.exam,st.exam.cur); const code=($('#ans-code')||{}).value||''; const out=$('#robot-out'); let html;
      try { const prog=OGE.parseRobot(code); const f=t.fields[0]; const stt=OGE.runRobot(f,prog); html=(stt.err?'<p class="err-msg">'+esc(stt.err)+'</p>':'<p class="muted small">Результат на примере. Проверка идёт на трёх разных полях.</p>')+OGE.robotSvg(f,stt,true); } catch(err){ html='<p class="err-msg">'+esc(err.message)+'</p>'; }
      if(out) out.innerHTML=html; break; }
    case 'listen': { const t=prac&&view.tab==='practice'? prac.task : examTask(st.exam,st.exam.cur); try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.listen); u.lang='ru-RU'; u.rate=0.9; const ru=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang)); if(ru) u.voice=ru; speechSynthesis.speak(u); const ls=$('#listen-st'); if(ls) ls.textContent='Идёт чтение…'; u.onend=()=>{ const l=$('#listen-st'); if(l) l.textContent='Чтение завершено.'; }; }catch(err){ const ls=$('#listen-st'); if(ls) ls.textContent='Озвучивание недоступно в этом браузере. Прочитай текст.'; } break; }
    case 'peek': { const p=$('#peek'); if(!p) break; p.hidden=false; let left=120; const ls=$('#listen-st'); const iv=setInterval(()=>{ left--; if(ls) ls.textContent='Текст скроется через '+left+' с'; if(left<=0||!document.body.contains(p)){ clearInterval(iv); if(document.body.contains(p)){ p.hidden=true; if(ls) ls.textContent='Текст скрыт. Пиши изложение.'; } } },1000); break; }
    case 'start-exam': if(st.exam && !st.exam.done && !b.dataset.sure && st.exam.subj!==s.id){ /* прерываем другой экзамен */ } startExam(s,b.dataset.mode); break;
    case 'resume-exam': view={name:'subj',subj:st.exam.subj,tab:'exam'}; render(); break;
    case 'ex-go': storeExamAnswer(); st.exam.cur=+b.dataset.n; save(); render(); break;
    case 'ex-next': case 'ex-prev': { storeExamAnswer(); const ex=st.exam; const i=ex.nums.indexOf(ex.cur); const j=act==='ex-next'? Math.min(ex.nums.length-1,i+1) : Math.max(0,i-1); ex.cur=ex.nums[j]; save(); render(); break; }
    case 'ask-finish': storeExamAnswer(); view.confirm=true; render(); break;
    case 'cancel-finish': view.confirm=false; render(); break;
    case 'finish-exam': finishExam(); break;
    case 'self-done': { const ex=st.exam; let missing=false; ex.selfCrit={}; ex.selfNums.forEach(n=>{ const t=examTask(ex,n); const arr=readCriteria(t,'x'+n); ex.selfCrit[n]=arr; if(arr.some(x=>x==null)) missing=true; ex.self[n]=arr.reduce((a,b)=>a+(b||0),0); });
      if(missing && !view.forceSelf){ view.forceSelf=true; save(); const p=$('.row-btn'); if(p && !$('.warn-self')) p.insertAdjacentHTML('beforebegin','<p class="warn-self">Не по всем критериям выбраны баллы. Невыбранные будут засчитаны как 0. Нажми ещё раз, чтобы подсчитать.</p>'); break; }
      view.forceSelf=false; computeExam(); render(); break; }
    case 'ex-sol': { const n=+b.dataset.n; view.exSol = view.exSol===n? null : n; render(); break; }
    case 'new-exam': st.exam=null; save(); render(); break;
    case 'errors-subj': view={name:'errors',filter:b.dataset.s}; render(); break;
    case 'err-f': view.filter=b.dataset.f; view.sel=[]; render(); break;
    case 'err-sel': { e.stopPropagation(); const k=b.dataset.k; view.sel=view.sel||[]; view.sel = b.checked? view.sel.concat(k) : view.sel.filter(x=>x!==k); render(); break; }
    case 'err-review': view={name:'review', sel:view.sel}; render(); break;
    case 'err-retry': { const [sid,n,seed,ctx]=b.dataset.k.split('|'); view={name:'subj',subj:sid,tab:'practice',popts:{queue:[{n:+n,seed:+seed,ctx:+ctx}]}}; prac=null; newPractice(OGE.bySubj[sid],view.popts); render(); break; }
    case 'review-practice': { const [sid,t]=b.dataset.k.split('|'); const q=openErrors(sid).filter(e=>e.t===t && OGE.make(e.s,e.n,e.seed,e.ctx).kind!=='self').map(e=>({n:e.n,seed:e.seed,ctx:e.ctx})); view={name:'subj',subj:sid,tab:'practice',popts:{topics:[t],queue:q}}; prac=null; newPractice(OGE.bySubj[sid],view.popts); render(); break; }
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target && (e.target.id==='ans' || /^ans-\d+$/.test(e.target.id))){
    e.preventDefault();
    if(view.name==='subj' && view.tab==='practice' && prac){ const b=$(prac.done?'[data-act="next"]':'[data-act="check"]'); if(b) b.click(); }
    else if(view.name==='subj' && view.tab==='exam'){ const b=$('[data-act="ex-next"]'); if(b) b.click(); }
  }
});
/* поиск по файлам (информатика, 11) */
document.addEventListener('input', e=>{
  const inp=e.target; if(!inp.classList || !inp.classList.contains('fsearch')) return;
  const wrap=inp.closest('.fs-wrap'); const q=inp.value.trim().toLowerCase();
  $$('.fs-text',wrap).forEach(pre=>{ if(!pre.dataset.raw) pre.dataset.raw=pre.textContent; const raw=pre.dataset.raw; const file=pre.closest('.fs-file');
    if(!q){ pre.textContent=raw; file.hidden=false; return; }
    const lines=raw.split('\n'); const hit=lines.filter(l=>l.toLowerCase().includes(q)); file.hidden=!hit.length;
    pre.innerHTML=hit.map(l=>{ const i=l.toLowerCase().indexOf(q); return esc(l.slice(0,i))+'<mark>'+esc(l.slice(i,i+q.length))+'</mark>'+esc(l.slice(i+q.length)); }).join('\n'); });
});
/* сортировка таблицы (информатика, 14) */
document.addEventListener('click', e=>{
  const th=e.target.closest('table.sheet th[data-col]'); if(!th) return; const tb=th.closest('table').tBodies[0]; const c=+th.dataset.col; const dir=th.dataset.dir==='asc'?'desc':'asc'; $$('th[data-col]',th.closest('table')).forEach(x=>delete x.dataset.dir); th.dataset.dir=dir;
  const rows=[...tb.rows]; rows.sort((a,b)=>{ const x=a.cells[c+1].textContent, y=b.cells[c+1].textContent; const nx=+x, ny=+y; const r= (!isNaN(nx)&&!isNaN(ny))? nx-ny : x.localeCompare(y,'ru'); return dir==='asc'?r:-r; }); rows.forEach(r=>tb.appendChild(r));
});

render();
})();

</script>
