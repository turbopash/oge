<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Тренажёр ОГЭ-9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600;700&display=swap">
<style>
/* Макет: боковая навигация + рабочая область, как тетрадь с бланком ответов ОГЭ. Ручка учителя — красная, бланк — синий. */
:root{
  --paper:#F6F8FB; --surface:#FFFFFF; --ink:#1B2333; --muted:#59647A; --line:#D9E0EA; --grid:#E3E9F2; --soft:#EEF3FA;
  --blank:#2F5BBF; --blank-soft:#E6EDFB; --pen:#C4313F; --pen-soft:#FBE7E9; --ok:#1F7A4D; --ok-soft:#E1F3E9; --hl:#FFEFA8; --warnc:#8A5A00; --warn-soft:#FFF4D6;
  --c-math:#2F5BBF; --c-inf:#0E7A84; --c-rus:#A8433A; --c-geo:#4C7A2B;
  --map:#F3F6EC; --water:#5B9BD5; --earth:#B07A3D; --grass:#5F9A3A; --cold:#2F5BBF; --warm:#D0573F;
  --house:#E9D8C2; --bath:#D7E6F5; --greenh:#D8EDCF; --pathc:#D9D3C7;
  --l1:#E8D9B5; --l2:#D6C08F; --l3:#C9B8A0; --l4:#B9A58A; --l5:#A28F77;
  --f-body:'Golos Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-disp:'Unbounded', 'Golos Text', 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --f-pen:'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  --accent:var(--blank);
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11151D; --surface:#181E29; --ink:#E6EAF2; --muted:#9BA6BA; --line:#2C3545; --grid:#252E3C; --soft:#1F2735;
  --blank:#7DA2F0; --blank-soft:#1E2A44; --pen:#F07A84; --pen-soft:#3A1F25; --ok:#5CC98E; --ok-soft:#173326; --hl:#5A4C14; --warnc:#F2C66B; --warn-soft:#3A3115;
  --c-math:#7DA2F0; --c-inf:#4FC3CC; --c-rus:#E58A7F; --c-geo:#8FC56A;
  --map:#1C2419; --water:#5D9BD8; --earth:#C9965A; --grass:#7DB85A; --cold:#7DA2F0; --warm:#F08A6E;
  --house:#4A3F31; --bath:#26384D; --greenh:#2A3F25; --pathc:#3D3A33;
  --l1:#5A4E35; --l2:#6B5A38; --l3:#5E5244; --l4:#53483B; --l5:#463C32; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#181E29; --ink:#E6EAF2; --muted:#9BA6BA; --line:#2C3545; --grid:#252E3C; --soft:#1F2735;
  --blank:#7DA2F0; --blank-soft:#1E2A44; --pen:#F07A84; --pen-soft:#3A1F25; --ok:#5CC98E; --ok-soft:#173326; --hl:#5A4C14; --warnc:#F2C66B; --warn-soft:#3A3115;
  --c-math:#7DA2F0; --c-inf:#4FC3CC; --c-rus:#E58A7F; --c-geo:#8FC56A;
  --map:#1C2419; --water:#5D9BD8; --earth:#C9965A; --grass:#7DB85A; --cold:#7DA2F0; --warm:#F08A6E;
  --house:#4A3F31; --bath:#26384D; --greenh:#2A3F25; --pathc:#3D3A33;
  --l1:#5A4E35; --l2:#6B5A38; --l3:#5E5244; --l4:#53483B; --l5:#463C32; color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--paper); color:var(--ink)}
body{font-family:var(--f-body); font-size:16px; line-height:1.55; margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
h1,h2,h3{text-wrap:balance; margin:0}
h1{font-family:var(--f-disp); font-weight:700; font-size:clamp(1.6rem,2.6vw,2.2rem); letter-spacing:-.01em; line-height:1.15}
.h2{font-family:var(--f-disp); font-weight:500; font-size:1.2rem; line-height:1.3; margin-bottom:.5rem}
.h3{font-size:1rem; font-weight:700; margin:1.3rem 0 .5rem}
p{margin:.4rem 0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.mono{font-family:var(--f-mono)}
.note{color:var(--muted); font-size:.92rem; border-left:3px solid var(--line); padding-left:.7rem}

#app{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh}
.main[data-subj="math"]{--accent:var(--c-math)} .main[data-subj="inf"]{--accent:var(--c-inf)} .main[data-subj="rus"]{--accent:var(--c-rus)} .main[data-subj="geo"]{--accent:var(--c-geo)}

/* боковая панель */
.side{position:sticky; top:env(safe-area-inset-top,0px); height:100vh; overflow:auto; padding:20px 14px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:14px}
.logo{display:flex; flex-direction:column; align-items:flex-start; background:none; border:0; cursor:pointer; padding:4px 8px}
.logo-m{font-family:var(--f-disp); font-weight:700; font-size:2rem; line-height:1; letter-spacing:.02em; color:var(--blank)}
.logo-s{font-size:.82rem; color:var(--muted); margin-top:4px}
.side-nav{display:flex; flex-direction:column; gap:2px}
.nav-cap{font-size:.78rem; color:var(--muted); margin:14px 8px 4px; letter-spacing:.04em}
.nav-i{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px; border:0; background:none; border-radius:8px; cursor:pointer; font-weight:500}
.nav-i:hover{background:var(--soft)}
.nav-i.on{background:var(--blank-soft); color:var(--ink); font-weight:700}
.nav-s .dot,.dot{width:10px; height:10px; border-radius:50%; background:var(--sc,var(--accent)); flex:none; display:inline-block}
.nav-n{margin-left:auto; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
.nav-badge{margin-left:auto; background:var(--pen); color:var(--surface); border-radius:999px; font-size:.75rem; font-weight:700; padding:1px 8px; font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto; font-size:.8rem; color:var(--muted); padding:0 8px}

.main{padding:28px clamp(16px,3vw,40px) 80px; min-width:0; max-width:1240px}

/* кнопки */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:8px 16px; border-radius:8px; border:1.5px solid var(--accent); background:var(--accent); color:var(--surface); font-weight:600; cursor:pointer; text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:transparent; color:var(--pen); border-color:var(--pen)}
.btn.small{min-height:32px; padding:4px 10px; font-size:.86rem}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.row-btn{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px}
.panel{margin-top:28px}
.chip{display:inline-block; font-size:.8rem; padding:2px 10px; border-radius:999px; background:var(--soft); color:var(--muted)}
.chip.warn{background:var(--warn-soft); color:var(--warnc)}

/* главная */
.hero{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:28px; align-items:end; padding-bottom:22px; border-bottom:2px solid var(--ink)}
.lead{font-size:1.08rem; max-width:60ch; color:var(--muted); margin-top:.8rem}
.hero-stat{display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1.5px solid var(--ink); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.hs{padding:12px 14px; border-right:1px solid var(--line)} .hs:last-child{border-right:0}
.hs b{display:block; font-family:var(--f-disp); font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums}
.hs span{font-size:.82rem; color:var(--muted)}
.banner{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-top:20px; padding:12px 16px; border-radius:var(--r); background:var(--blank-soft)}
.banner.warn{background:var(--warn-soft); color:var(--warnc)}
.modes{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; margin-top:26px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.mode{padding:16px 18px 16px 0; display:grid; grid-template-columns:auto 1fr; column-gap:12px}
.mode + .mode{padding-left:18px; border-left:1px solid var(--line)}
.mode-n{grid-row:span 2; font-family:var(--f-disp); font-weight:700; font-size:1.8rem; color:var(--blank); line-height:1}
.mode h3{font-size:1.02rem} .mode p{color:var(--muted); font-size:.92rem; margin:2px 0 0}
.subjects{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:26px}
.scard{background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--sc); border-radius:var(--r); padding:18px 20px; display:flex; flex-direction:column; gap:8px}
.scard-top{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px}
.scard h2{font-family:var(--f-disp); font-weight:500; font-size:1.3rem}
.meta{font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums}
.scard-p{font-size:.9rem; color:var(--muted); margin:0}
.scard-bar{height:6px; background:var(--soft); border-radius:999px; overflow:hidden} .scard-bar i{display:block; height:100%; background:var(--sc)}
.scard-m{font-size:.84rem; color:var(--muted); margin:0}
.scard-btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:6px}
.scard .btn{--accent:var(--sc)}
.weak{list-style:none; margin:0; padding:0} .weak li{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)} .weak .rate{margin-left:auto; color:var(--pen); font-weight:700; font-variant-numeric:tabular-nums}

/* предмет */
.sub-h{display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-end; margin-bottom:16px}
.sub-h p{max-width:72ch}
.tabs{display:flex; flex-wrap:wrap; gap:4px; border-bottom:2px solid var(--line); margin-bottom:22px}
.tab{border:0; background:none; padding:10px 16px; cursor:pointer; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-2px}
.tab.on{color:var(--ink); border-bottom-color:var(--accent)}

.learn{display:grid; grid-template-columns:280px minmax(0,1fr); gap:24px; align-items:start}
.tlist{display:flex; flex-direction:column; gap:2px; position:sticky; top:16px}
.titem{display:grid; grid-template-columns:1fr auto; text-align:left; border:0; background:none; padding:9px 12px; border-radius:8px; cursor:pointer; border-left:3px solid transparent}
.titem:hover{background:var(--soft)} .titem.on{background:var(--surface); border-left-color:var(--accent); box-shadow:0 0 0 1px var(--line)}
.tnums{grid-column:1; font-size:.76rem; color:var(--muted)} .tt{grid-column:1; font-weight:600; font-size:.95rem}
.tpct{grid-column:2; grid-row:1/span 2; align-self:center; font-size:.8rem; color:var(--ok); font-weight:700} .tpct.low{color:var(--pen)}
.tcontent{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:24px 28px; min-width:0}
.rule{border:1.5px solid var(--ink); border-radius:8px; padding:12px 16px; margin:10px 0; background:var(--surface)}
.rule-t{font-weight:700; font-size:.82rem; letter-spacing:.04em; color:var(--accent); margin-bottom:4px}
.example{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:0; border:1px solid var(--line); border-radius:8px; margin:10px 0; overflow:hidden}
.ex-q{padding:10px 14px; background:var(--soft); font-weight:600}
.ex-a{padding:10px 14px}
.mistakes{border-left:4px solid var(--pen); background:var(--pen-soft); padding:10px 16px; border-radius:0 8px 8px 0; margin:14px 0}
.mistakes .rule-t{color:var(--pen)} .mistakes ul{margin:0; padding-left:18px}
.steps3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:10px 0}
.step{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--soft)} .step p{font-size:.9rem; margin:4px 0 0}
.parse{font-size:1.05rem; padding:12px 16px; background:var(--soft); border-radius:8px; margin:10px 0}
.u1{border-bottom:2px solid var(--ink)} .u2{border-bottom:5px double var(--ink)} .u0{border-bottom:2px solid var(--ink)} .hl{background:var(--hl); padding:0 2px}

table.mini{border-collapse:collapse; margin:10px 0; font-size:.94rem; font-variant-numeric:tabular-nums}
table.mini th,table.mini td{border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top}
table.mini th{background:var(--soft); font-weight:600}
.tablewrap{overflow-x:auto}

/* задание */
.prac{display:flex; flex-direction:column; gap:18px}
.pfilter{display:flex; flex-direction:column; gap:10px}
.pf-row{display:grid; grid-template-columns:70px minmax(0,1fr); gap:10px; align-items:start}
.pf-l{font-size:.85rem; color:var(--muted); padding-top:6px}
.pchips{display:flex; flex-wrap:wrap; gap:6px}
.pchip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:.88rem}
.pchip.on{background:var(--accent); color:var(--surface); border-color:var(--accent)}
.ngrid{display:flex; flex-wrap:wrap; gap:5px}
.ncell{width:36px; height:36px; border:1.5px solid var(--line); background:var(--surface); border-radius:6px; cursor:pointer; font-weight:600; font-variant-numeric:tabular-nums}
.ncell.g{border-color:var(--ok); color:var(--ok)} .ncell.y{border-color:var(--warnc); color:var(--warnc)} .ncell.r{border-color:var(--pen); color:var(--pen)}
.ncell.on{background:var(--accent); color:var(--surface); border-color:var(--accent)}
.task{min-width:0}
.task-h{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-bottom:12px; margin-bottom:12px; border-bottom:1px dashed var(--line)}
.tnum{font-family:var(--f-disp); font-weight:700; font-size:1.05rem; background:var(--accent); color:var(--surface); padding:3px 10px; border-radius:6px}
.ttl{font-weight:700}
.pts{margin-left:auto; font-size:.85rem; color:var(--muted)}
.task-text{font-size:1.04rem; max-width:80ch}
.task-text ol{padding-left:22px} .task-text li{margin:3px 0}
.quote{background:var(--soft); border-radius:8px; padding:10px 14px}
.ctx{margin-bottom:10px}
.ctx-text summary{cursor:pointer; font-weight:600; color:var(--accent)}
.answer{margin:16px 0 4px}
.lbl{display:block; font-size:.84rem; color:var(--muted); margin-bottom:4px}
/* бланк ответов: клетка 30px, моноширинный шрифт */
.blank{display:inline-block; max-width:100%; overflow-x:auto; vertical-align:middle}
.blank-in{--cell:30px; width:calc(var(--cell)*17 + 2px); height:44px; border:1.5px solid var(--blank); border-radius:4px; font-family:var(--f-mono); font-size:20px; font-weight:600; color:var(--ink);
  letter-spacing:calc(var(--cell) - 1ch); padding:0 0 0 calc((var(--cell) - 1ch)/2); background-color:var(--surface);
  background-image:repeating-linear-gradient(90deg, transparent 0 calc(var(--cell) - 1px), var(--blank-soft) calc(var(--cell) - 1px) var(--cell));}
.blank-wide .blank-in{width:calc(var(--cell)*24 + 2px)}
.split .blank-in{--cell:23px; font-size:17px}
.blank-in:disabled{opacity:.85}
.plain-in{font:inherit; padding:8px 10px; border:1.5px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); min-width:0; width:100%}
.plain-in.wide{max-width:640px}
.essay,.code-in{width:100%; font:inherit; padding:12px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); line-height:1.6; resize:vertical}
.essay{background-image:repeating-linear-gradient(transparent 0 calc(1.6em - 1px), var(--grid) calc(1.6em - 1px) 1.6em); background-attachment:local}
.code-in{font-family:var(--f-mono); font-size:.95rem}
.wc{font-size:.84rem; color:var(--muted); margin-top:4px}
.multi{display:flex; flex-direction:column; gap:12px} .mf label{display:block; margin-bottom:4px}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.actions .next{margin-left:auto}
.hintbox{margin-top:14px; padding:12px 16px; background:var(--hl); border-radius:8px; color:var(--ink)}
.verdict{display:flex; align-items:center; gap:14px; margin-top:16px; padding:12px 16px; border-radius:8px}
.v-ok{background:var(--ok-soft)} .v-bad{background:var(--pen-soft)} .v-part{background:var(--warn-soft)}
.pen{font-family:var(--f-pen); font-weight:700; font-size:1.7rem; line-height:1; flex:none}
.v-ok .pen{color:var(--ok)} .v-bad .pen{color:var(--pen)} .v-part .pen{color:var(--warnc)}
.solbox{margin-top:16px; padding:14px 18px; border:1.5px dashed var(--accent); border-radius:8px}
.solbox summary{cursor:pointer; font-weight:600; color:var(--accent)}
.selfbox{margin-top:16px}
.criteria{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.criteria.need .crit{border-color:var(--pen)}
.crit{border:1px solid var(--line); border-radius:8px; padding:8px 14px 10px; margin:0}
.crit legend{padding:0 6px; font-size:.95rem}
.lvl{display:grid; grid-template-columns:auto 22px 1fr; gap:6px; align-items:baseline; padding:4px 0; cursor:pointer; font-size:.94rem}
.lvl-v{font-weight:700; font-variant-numeric:tabular-nums}
.model p{font-style:italic}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start}
.split-l{position:sticky; top:12px; max-height:calc(100vh - 40px); overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px}
.rtext{font-size:.98rem; line-height:1.6} .rtext p{text-indent:1.2em; margin:.3rem 0}
.rtext-t{font-weight:700; margin-bottom:6px}
.src{font-size:.8rem; color:var(--muted); text-indent:0!important}
.match{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; background:var(--soft); padding:12px 16px; border-radius:8px}
.essay-themes{list-style:none; padding:0} .essay-themes li{padding:6px 0; border-bottom:1px solid var(--line)}
.listen{border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px}
.listen-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.listen-st{font-size:.88rem; color:var(--muted)}
.peek{margin-top:10px; padding:12px 14px; background:var(--soft); border-radius:8px}
.mine{background:var(--soft); border-radius:8px; padding:10px 14px; margin:10px 0}
.err-msg{color:var(--pen); font-weight:600}
.good{color:var(--ok); font-weight:600} .bad{color:var(--pen); font-weight:600}
.runs{display:flex; flex-wrap:wrap; gap:14px} .run{margin:0} .run figcaption{font-size:.88rem}

/* рисунки */
.fig{display:block; max-width:100%; height:auto; margin:10px 0}
.fig text{font-family:var(--f-body); font-size:13px; fill:var(--ink)}
.graphs{display:flex; flex-wrap:wrap; gap:14px} .gcell{margin:0} .gcell figcaption{font-weight:700}
.fig.small{max-width:170px}
.s-ink{stroke:var(--ink); stroke-width:1.6; fill:none}
.s-thin{stroke:var(--ink); stroke-width:1; fill:none}
.s-grid{stroke:var(--grid); stroke-width:1}
.s-axis{stroke:var(--ink); stroke-width:1.4}
.s-fn{stroke:var(--accent); stroke-width:2.4; fill:none; stroke-linejoin:round}
.s-dash{stroke:var(--muted); stroke-width:1.4; stroke-dasharray:4 4}
.s-border{stroke:var(--ink); stroke-width:2.6; fill:none}
.s-gate{stroke:var(--pen); stroke-width:3; stroke-dasharray:5 4}
.s-river{stroke:var(--water); stroke-width:5; fill:none; opacity:.8}
.s-iso{stroke:var(--muted); stroke-width:1.2; fill:none}
.s-front{stroke:var(--cold); stroke-width:2.4; fill:none}
.s-temp{stroke:var(--warm); stroke-width:2.4; fill:none}
.s-contour{stroke:var(--earth); stroke-width:1.1; fill:none} .s-contour-b{stroke-width:2.2}
.s-ab{stroke:var(--pen); stroke-width:2; stroke-dasharray:6 4}
.s-swamp{stroke:var(--water); stroke-width:1.6}
.s-grass{stroke:var(--grass); stroke-width:1.6; fill:none}
.s-site{stroke:var(--ink); stroke-width:2; fill:none; stroke-dasharray:4 3}
.s-birth{stroke:var(--blank); stroke-width:2.2; fill:none} .s-death{stroke:var(--warm); stroke-width:2.2; fill:none}

<script>
/* ОГЭ-9: ядро — случайные числа, дроби, форматирование, проверка ответов, SVG-помощники */
(function(){
'use strict';
const OGE = window.OGE = { subjects: [], bySubj: {} };

/* ---------- детерминированный генератор ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function Rng(seed){
  const f = mulberry32((seed>>>0) ^ 0x9E3779B9);
  for(let i=0;i<5;i++) f();
  this.f = f;
}
Rng.prototype.next = function(){ return this.f(); };
Rng.prototype.int = function(a,b){ return a + Math.floor(this.f()*(b-a+1)); };
Rng.prototype.pick = function(arr){ return arr[Math.floor(this.f()*arr.length)]; };
Rng.prototype.chance = function(p){ return this.f() < p; };
Rng.prototype.shuffle = function(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(this.f()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
Rng.prototype.sample = function(arr,k){ return this.shuffle(arr).slice(0,k); };
Rng.prototype.sign = function(){ return this.f()<0.5?-1:1; };
OGE.Rng = Rng;
OGE.rng = s => new Rng(s);

/* ---------- математика ---------- */
const gcd = (a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
OGE.gcd = gcd;
function Fr(n,d){ if(d===undefined) d=1; if(d<0){n=-n;d=-d;} const g=gcd(n,d)||1; this.n=n/g; this.d=d/g; }
Fr.prototype.add=function(o){o=fr(o);return new Fr(this.n*o.d+o.n*this.d,this.d*o.d);};
Fr.prototype.sub=function(o){o=fr(o);return new Fr(this.n*o.d-o.n*this.d,this.d*o.d);};
Fr.prototype.mul=function(o){o=fr(o);return new Fr(this.n*o.n,this.d*o.d);};
Fr.prototype.div=function(o){o=fr(o);return new Fr(this.n*o.d,this.d*o.n);};
Fr.prototype.val=function(){return this.n/this.d;};
Fr.prototype.finite=function(){let d=this.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;};
function fr(x){ if(x instanceof Fr) return x; if(Number.isInteger(x)) return new Fr(x,1); const s=String(x); const k=(s.split('.')[1]||'').length; return new Fr(Math.round(x*Math.pow(10,k)),Math.pow(10,k)); }
OGE.Fr = Fr; OGE.fr = fr;

/* число -> строка с запятой (как в бланке ОГЭ) */
function fmt(x){
  if(x instanceof Fr) x = x.val();
  let v = Math.round(x*1e9)/1e9;
  if(Object.is(v,-0)) v = 0;
  let s = String(v);
  if(/e/.test(s)) s = v.toFixed(10).replace(/0+$/,'').replace(/\.$/,'');
  return s.replace('.',',').replace('-','−');
}
OGE.fmt = fmt;
/* для формул в тексте: отрицательные в скобках */
OGE.par = x => (x<0? '('+fmt(x)+')' : fmt(x));
OGE.frac = (a,b) => '<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';
OGE.rad = a => '<span class="rad">√<span>'+a+'</span></span>';
OGE.sup = (a,b) => a+'<sup>'+b+'</sup>';
/* коэффициент при x: 1 -> '', -1 -> '−' */
OGE.coef = (k, v) => k===1? v : k===-1? '−'+v : fmt(k)+v;
/* многочлен из слагаемых [коэф, 'x²'] */
OGE.poly = terms => {
  let out=''; terms.forEach(([k,v],i)=>{ if(k===0) return; const s = k<0?'−':'+'; const a=Math.abs(k); const body = (a===1 && v)? v : fmt(a)+v;
    if(out==='') out = (k<0?'−':'')+body; else out += ' '+s+' '+body; });
  return out || '0';
};

/* ---------- нормализация и проверка ---------- */
function norm(s){
  return String(s==null?'':s).toLowerCase().replace(/ё/g,'е').replace(/[\s«»"'`]/g,'').replace(/−|–|—/g,'-').replace(/\.$/,'');
}
OGE.norm = norm;
function toNum(s){
  const t = String(s).trim().replace(/\s/g,'').replace(/−|–|—/g,'-').replace(',', '.');
  if(t==='' || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  return parseFloat(t);
}
OGE.toNum = toNum;
function eqNum(a,b){ return Math.abs(a-b) < 1e-6*Math.max(1,Math.abs(b)); }

/* проверка одного поля; kind: num | str | set | seq | numset */
function checkField(kind, user, ans, alt){
  const variants = [ans].concat(alt||[]);
  if(user==null || String(user).trim()==='') return false;
  for(const a of variants){
    if(kind==='num'){ const u=toNum(user), v=toNum(a); if(!isNaN(u) && eqNum(u,v)) return true; }
    else if(kind==='set'){ const u=norm(user).replace(/[,;]/g,'').split('').sort().join(''); const v=norm(a).split('').sort().join(''); if(u===v) return true; }
    else if(kind==='seq'){ if(norm(user).replace(/[,;]/g,'')===norm(a)) return true; }
    else if(kind==='numset'){
      const parse = s => String(s).replace(/−/g,'-').split(/;|\s+/).map(x=>x.trim()).filter(Boolean).map(toNum);
      const u = parse(user), v = parse(a);
      if(u.some(isNaN)) continue;
      const us=[...u].sort((x,y)=>x-y), vs=[...v].sort((x,y)=>x-y);
      if(us.length===vs.length && us.every((x,i)=>eqNum(x,vs[i]))) return true;
    }
    else if(kind==='kw'){ const u=norm(user); if(u.length>=3 && norm(a).split('|').some(k=>k && u.includes(k))) return true; }
    else { if(norm(user)===norm(a)) return true; }
  }
  return false;
}
OGE.checkField = checkField;

/* проверка задания: возвращает {score,max,auto} */
OGE.check = function(task, user){
  if(task.kind==='self') return {score:null, max:task.pts, auto:false};
  if(task.kind==='multi'){
    const u = user||[]; let s=0;
    task.fields.forEach((f,i)=>{ if(checkField(f.kind||'num', u[i], f.ans, f.alt)) s += (f.pts||1); });
    return {score:s, max:task.pts, auto:true};
  }
  if(task.kind==='tests'){
    const u = user||[]; let wrong=0;
    task.tests.forEach((t,i)=>{ if(!checkField('num', u[i], t.out)) wrong++; });
    const filled = u.filter(x=>x!=null && String(x).trim()!=='').length;
    if(filled===0) return {score:0,max:task.pts,auto:true};
    return {score: wrong===0?2: wrong===1?1:0, max:task.pts, auto:true};
  }
  if(task.kind==='robot'){
    if(!user || !user.code) return {score:0,max:task.pts,auto:true};
    const r = OGE.robotJudge(task, user.code);
    return {score:r.score, max:task.pts, auto:true, robot:r};
  }
  const ok = checkField(task.kind||'num', user, task.ans, task.alt);
  return {score: ok? task.pts : 0, max: task.pts, auto:true};
};

/* ---------- SVG ---------- */
OGE.svg = function(w,h,inner,label,cls){
  return '<svg class="fig '+(cls||'')+'" viewBox="0 0 '+w+' '+h+'" width="'+w+'" role="img" aria-label="'+(label||'Рисунок к заданию')+'">'+inner+'</svg>';
};
OGE.plural = (n,one,few,many) => { const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?one:(m10>=2&&m10<=4&&(m100<12||m100>14))?few:many; };

OGE.vlabel = function(p, center, name, d){
  d = d||14; const dx=p[0]-center[0], dy=p[1]-center[1]; const L=Math.hypot(dx,dy)||1;
  return OGE.text((p[0]+dx/L*d).toFixed(1), (p[1]+dy/L*d+5).toFixed(1), name, 't-ink t-it');

/* ---------- регистрация предметов ---------- */
OGE.register = function(s){
  s.lineByN = {}; s.lines.forEach(l=>{ s.lineByN[l.n]=l; });
  s.topicById = {}; s.topics.forEach(t=>{ s.topicById[t.id]=t; t.nums = s.lines.filter(l=>l.topic===t.id).map(l=>l.n); });
  OGE.subjects.push(s); OGE.bySubj[s.id]=s;
};

/* создать задание: subj, номер линии, seed, ctxSeed (общий контекст варианта) */
OGE.make = function(subjId, n, seed, ctxSeed){
  const s = OGE.bySubj[subjId]; const line = s.lineByN[n];
  const r = new Rng(seed*7919 + n*104729 + 13);
  const cr = new Rng((ctxSeed==null? seed : ctxSeed)*6151 + 77);
  const t = line.gen(r, cr, seed);
  t.subj = subjId; t.n = n; t.seed = seed; t.ctx = (ctxSeed==null? seed : ctxSeed);
  t.topic = t.topic || line.topic; t.pts = t.pts || line.pts || 1;
  t.kind = t.kind || 'num';
  t.id = subjId+'-'+n+'-'+seed+(ctxSeed!=null && ctxSeed!==seed? '-c'+ctxSeed : '');
  t.lineTitle = line.title;
  return t;
};

/* ---------- исполнитель «Робот» (школьный алгоритмический язык) ---------- */
/* поле: {w,h, walls:Set('x,y,dir') где dir из R,D (стена справа/снизу клетки), start:[x,y], need:Set('x,y')} */
function wallKey(x,y,d){ return x+','+y+','+d; }
OGE.wallKey = wallKey;
function blocked(f,x,y,dir){
  if(dir==='R') return x>=f.w-1 || f.walls.has(wallKey(x,y,'R'));
  if(dir==='L') return x<=0 || f.walls.has(wallKey(x-1,y,'R'));
  if(dir==='D') return y>=f.h-1 || f.walls.has(wallKey(x,y,'D'));
  if(dir==='U') return y<=0 || f.walls.has(wallKey(x,y-1,'D'));
}
OGE.robotBlocked = blocked;

function parseRobot(code){
  const raw = code.replace(/\r/g,'').split(/\n|;/).map(s=>s.replace(/\|.*$/,'').replace(/\/\/.*$/,'').trim()).filter(Boolean);
  // разбиваем на токены-строки, учитываем "нц пока ...", "кц", "если ... то", "иначе", "все"
  const toks = [];
  raw.forEach(line=>{
    let l = line.toLowerCase().replace(/ё/g,'е');
    if(/^(использовать|алг|нач|кон)\b/.test(l) && !/^(нач|кон)\S/.test(l)) return;
    // поддержка "если ... то команда все" в одну строку
    l = l.replace(/\s+то\s+/,' то\n').replace(/\s+иначе\s+/,'\nиначе\n').replace(/\s+все$/,'\nвсе');
    l.split('\n').forEach(x=>{ x=x.trim(); if(x) toks.push(x); });
  });
  let i=0;
  function block(endWords){
    const body=[];
    while(i<toks.length){
      const t = toks[i];
      if(endWords.includes(t)) return body;
      i++;
      let m;
      if((m = t.match(/^нц\s+пока\s+(.+)$/))){ const cond = parseCond(m[1]); const b = block(['кц']); if(toks[i]!=='кц') throw new Error('Не найден «кц» для цикла «нц пока»'); i++; body.push({op:'while',cond,body:b}); continue; }
      if((m = t.match(/^нц\s+(\d+)\s+раз$/))){ const b = block(['кц']); if(toks[i]!=='кц') throw new Error('Не найден «кц» для цикла'); i++; body.push({op:'rep',n:+m[1],body:b}); continue; }
      if((m = t.match(/^если\s+(.+?)\s*(то)?$/))){ const cond=parseCond(m[1]); const a=block(['иначе','все']); let b=[]; if(toks[i]==='иначе'){ i++; b=block(['все']); } if(toks[i]!=='все') throw new Error('Не найдено «все» для «если»'); i++; body.push({op:'if',cond,a,b}); continue; }
      if(t==='то') continue;
      const cmd = {'вверх':'U','вниз':'D','влево':'L','вправо':'R','закрасить':'P'}[t];
      if(cmd){ body.push({op:'cmd',c:cmd}); continue; }
      throw new Error('Неизвестная команда: «'+t+'»');
    }
    return body;
  }
  const prog = block([]);
  if(i<toks.length) throw new Error('Лишнее слово: «'+toks[i]+'»');
  return prog;
}
function parseCond(s){
  s = s.trim().replace(/\s+то$/,'');
  // или — самый низкий приоритет, затем и, затем не
  const orParts = splitTop(s,' или ');
  if(orParts.length>1) return {t:'or',parts:orParts.map(parseCond)};
  const andParts = splitTop(s,' и ');
  if(andParts.length>1) return {t:'and',parts:andParts.map(parseCond)};
  if(/^не\s+/.test(s)) return {t:'not',a:parseCond(s.replace(/^не\s+/,''))};
  if(/^\(.*\)$/.test(s)) return parseCond(s.slice(1,-1));
  const m = s.match(/^(сверху|снизу|слева|справа)\s+(свободно|стена)$/);
  if(m) return {t:'side',d:{'сверху':'U','снизу':'D','слева':'L','справа':'R'}[m[1]],free:m[2]==='свободно'};
  if(/^клетка\s+закрашена$/.test(s)) return {t:'painted',v:true};
  if(/^клетка\s+чистая$/.test(s)) return {t:'painted',v:false};
  throw new Error('Непонятное условие: «'+s+'»');
}
function splitTop(s,sep){ const out=[]; let depth=0, cur=''; for(let i=0;i<s.length;i++){ const c=s[i]; if(c==='(')depth++; if(c===')')depth--; if(depth===0 && s.substr(i,sep.length)===sep){ out.push(cur); cur=''; i+=sep.length-1; continue;} cur+=c; } out.push(cur); return out.map(x=>x.trim()); }

function runRobot(f, prog){
  const st = {x:f.start[0], y:f.start[1], painted:new Set(), steps:0, path:[[f.start[0],f.start[1]]], err:null};
  function ev(c){
    if(c.t==='or') return c.parts.some(ev);
    if(c.t==='and') return c.parts.every(ev);
    if(c.t==='not') return !ev(c.a);
    if(c.t==='side'){ const b = blocked(f,st.x,st.y,c.d); return c.free? !b : b; }
    if(c.t==='painted'){ return st.painted.has(st.x+','+st.y)===c.v; }
  }
  function exec(list){
    for(const s of list){
      if(st.err) return;
      if(++st.steps > 20000){ st.err='Программа выполняется слишком долго — похоже, цикл никогда не заканчивается.'; return; }
      if(s.op==='cmd'){
        if(s.c==='P'){ st.painted.add(st.x+','+st.y); continue; }
        if(blocked(f,st.x,st.y,s.c)){ st.err='Робот разбился о стену в клетке ('+(st.x+1)+'; '+(st.y+1)+').'; return; }
        st.x += s.c==='R'?1: s.c==='L'?-1:0; st.y += s.c==='D'?1: s.c==='U'?-1:0; st.path.push([st.x,st.y]);
      } else if(s.op==='while'){ while(!st.err && ev(s.cond)){ exec(s.body); if(++st.steps>20000){ st.err='Программа выполняется слишком долго — похоже, цикл никогда не заканчивается.'; return; } } }
      else if(s.op==='rep'){ for(let k=0;k<s.n && !st.err;k++) exec(s.body); }
      else if(s.op==='if'){ exec(ev(s.cond)? s.a : s.b); }
    }
  }
  exec(prog);
  return st;
}
OGE.parseRobot = parseRobot; OGE.runRobot = runRobot;

/* проверка программы на нескольких полях задания */
OGE.robotJudge = function(task, code){
  let prog;
  try { prog = parseRobot(code); } catch(e){ return {score:0, error:e.message, runs:[]}; }
  const runs = task.fields.map(f=>{
    const st = runRobot(f, prog);
    let missing=0, extra=0;
    f.need.forEach(k=>{ if(!st.painted.has(k)) missing++; });
    st.painted.forEach(k=>{ if(!f.need.has(k)) extra++; });
    return {field:f, st, missing, extra, ok: !st.err && missing===0 && extra===0};
  });
  let score = 0;
  if(runs.every(r=>r.ok)) score = 2;
  else if(runs.every(r=>!r.st.err && r.missing+r.extra<=10) && runs.some(r=>r.ok)) score = 1;
  return {score, runs};
};

/* рисунок поля робота */
OGE.robotSvg = function(f, st, showNeed){
  const c=26, pad=8, W=f.w*c+pad*2, H=f.h*c+pad*2; let g='';
  for(let y=0;y<f.h;y++) for(let x=0;x<f.w;x++){
    const k=x+','+y; let cls='r-cell';
    if(st && st.painted.has(k)) cls += f.need.has(k)? ' r-ok':' r-extra';
    else if(showNeed && f.need.has(k)) cls += ' r-need';
    g += '<rect x="'+(pad+x*c)+'" y="'+(pad+y*c)+'" width="'+c+'" height="'+c+'" class="'+cls+'"/>';
  }
  f.walls.forEach(k=>{ const [x,y,d]=k.split(','); const X=+x, Y=+y;
    if(d==='R') g += '<line x1="'+(pad+(X+1)*c)+'" y1="'+(pad+Y*c)+'" x2="'+(pad+(X+1)*c)+'" y2="'+(pad+(Y+1)*c)+'" class="r-wall"/>';
    else g += '<line x1="'+(pad+X*c)+'" y1="'+(pad+(Y+1)*c)+'" x2="'+(pad+(X+1)*c)+'" y2="'+(pad+(Y+1)*c)+'" class="r-wall"/>';
  });
  g += '<rect x="'+pad+'" y="'+pad+'" width="'+(f.w*c)+'" height="'+(f.h*c)+'" class="r-border"/>';
  const rx = st? st.x : f.start[0], ry = st? st.y : f.start[1];
  if(st && st.path.length>1){ g += '<polyline points="'+st.path.map(p=>(pad+p[0]*c+c/2)+','+(pad+p[1]*c+c/2)).join(' ')+'" class="r-path"/>'; }
  g += '<g transform="translate('+(pad+rx*c+c/2)+','+(pad+ry*c+c/2)+')"><path d="M0,-8 L7,0 L0,8 L-7,0 Z" class="r-bot"/></g>';
  return OGE.svg(W,H,g,'Поле исполнителя Робот','robot');
};
})();

L(7,'Числа на координатной прямой','line',1,(r)=>{
  if(r.chance(0.55)){
    let N; do{ N=r.int(3,90); }while(Number.isInteger(Math.sqrt(N)));
    const v=Math.sqrt(N); const xs=[v]; let tries=0;
    while(xs.length<4 && tries<200){ tries++; const c=Math.floor(v)-1.6+r.next()*4; if(xs.every(x=>Math.abs(x-c)>0.45) && c>0) xs.push(c); }
    const names=['A','B','C','D']; const sorted=xs.slice().sort((a,b)=>a-b); const ansName=names[sorted.indexOf(v)];
    const lo=Math.floor(sorted[0])-1>=0?Math.floor(sorted[0])-1:0, hi=Math.ceil(sorted[3])+1;
    return {text:'<p>Одна из точек, отмеченных на координатной прямой, соответствует числу '+rad(N)+'. Какая это точка?</p>'+numLine(lo,hi,sorted.map((x,i)=>({x,name:names[i]})))+'<p>1) A&nbsp;&nbsp; 2) B&nbsp;&nbsp; 3) C&nbsp;&nbsp; 4) D</p>',
      ans:String(names.indexOf(ansName)+1), hint:'Найди два соседних полных квадрата, между которыми лежит '+N+'.',
      sol:Math.floor(v)+'² = '+Math.floor(v)**2+', '+Math.ceil(v)+'² = '+Math.ceil(v)**2+', значит '+Math.floor(v)+' &lt; '+rad(N)+' &lt; '+Math.ceil(v)+'. Точнее: '+rad(N)+' ≈ '+fmt(Math.round(v*100)/100)+'. Этому месту соответствует точка '+ansName+'. Ответ: '+(names.indexOf(ansName)+1)+'.'};
  }
  const a=-(r.int(12,28)/10), b=r.int(12,34)/10;
  const pool=[['ab &gt; 0',a*b>0],['ab &lt; 0',a*b<0],['a − b &gt; 0',a-b>0],['a − b &lt; 0',a-b<0],['b − a &lt; 0',b-a<0],['b − a &gt; 0',b-a>0],['a² &lt; 0',false],[''+frac('a','b')+' &gt; 0',a/b>0],[''+frac('a','b')+' &lt; 0',a/b<0]];
  const tr=r.pick(pool.filter(p=>p[1])), fl=r.sample(pool.filter(p=>!p[1]),3); const opts=r.shuffle([tr].concat(fl)); const k=opts.indexOf(tr)+1;
  return {text:'<p>На координатной прямой отмечены числа a и b. Какое из утверждений верно?</p>'+numLine(-3,4,[{x:a,name:'a'},{x:b,name:'b'}])+'<p>'+opts.map((o,i)=>(i+1)+') '+o[0]).join('&nbsp;&nbsp;&nbsp; ')+'</p>',
    ans:String(k), hint:'По рисунку: a отрицательное, b положительное. Подставь знаки в каждое неравенство.',
    sol:'a &lt; 0, b &gt; 0. Произведение и частное чисел разных знаков отрицательны; из меньшего числа вычитать большее — получится отрицательное. Верно утверждение '+k+': '+tr[0]+'.'};
});

L(8,'Степени и корни','calc',1,(r)=>{
  const t=r.int(0,3);
  if(t===0){ let R,d,q; do{ R=r.int(4,24); const sq=R*R; const ds=[]; for(let i=2;i<sq;i++) if(sq%i===0 && !Number.isInteger(Math.sqrt(i)) && !Number.isInteger(Math.sqrt(sq/i))) ds.push(i); if(!ds.length) continue; d=r.pick(ds); q=sq/d; }while(!d||!q);
    return {text:'<p>Найдите значение выражения '+rad(d)+' · '+rad(q)+'.</p>', ans:fmt(R), hint:'Произведение корней равно корню из произведения.', sol:rad(d)+' · '+rad(q)+' = '+rad(d+' · '+q)+' = '+rad(d*q)+' = '+R+'.'}; }
  if(t===1){ const a=r.pick([2,3,5,10]); const res=r.int(0,a===10?3:a===5?3:4); const m=r.int(2,4), k=r.int(2,3), n=r.int(-3,4); const p=m*k+n-res;
    return {text:'<p>Найдите значение выражения '+frac('('+sup(a,m)+')'+'<sup>'+k+'</sup> · '+sup(a,fmt(n)), sup(a,fmt(p)))+'.</p>', ans:fmt(a**res), hint:'При возведении степени в степень показатели перемножаются, при умножении — складываются, при делении — вычитаются.',
      sol:'Показатель: '+m+'·'+k+' + ('+fmt(n)+') − '+p+' = '+res+'. Значит, выражение равно '+sup(a,res)+' = '+(a**res)+'.'}; }
  if(t===2){ let a,b; do{ a=r.int(2,40); b=r.int(2,40); }while(a===b||Number.isInteger(Math.sqrt(a))||Number.isInteger(Math.sqrt(b)));
    return {text:'<p>Найдите значение выражения ('+rad(a)+' − '+rad(b)+')('+rad(a)+' + '+rad(b)+').</p>', ans:fmt(a-b), hint:'Формула разности квадратов: (x − y)(x + y) = x² − y².', sol:'('+rad(a)+')² − ('+rad(b)+')² = '+a+' − '+b+' = '+fmt(a-b)+'.'}; }
  const p=r.pick([2,3,5,7]), q=r.pick([2,3,5,7].filter(x=>x!==p)), e1=r.pick([2,4]), e2=r.pick([2,4,6]); const res=p**(e1/2)*q**(e2/2);
  return {text:'<p>Найдите значение выражения '+rad(sup(p,e1)+' · '+sup(q,e2))+'.</p>', ans:fmt(res), hint:'Извлеки корень из каждого множителя: √(a²ᵏ) = aᵏ.', sol:rad(sup(p,e1))+' · '+rad(sup(q,e2))+' = '+sup(p,e1/2)+' · '+sup(q,e2/2)+' = '+res+'.'};
});

L(9,'Линейные и квадратные уравнения','eq',1,(r)=>{

    if(!Number.isInteger(d)) { x=Math.round(x); d=(a-c)*x+b; }
    return {text:'<p>Найдите корень уравнения '+poly([[a,'x'],[b,'']])+' = '+poly([[c,'x'],[d,'']])+'.</p>', ans:fmt(x), hint:'Перенеси слагаемые с x влево, числа вправо, меняя знак.',

  let x1,x2; do{ x1=r.int(-9,9); x2=r.int(-9,9);}while(x1===x2);
  const p=-(x1+x2), q=x1*x2; const big=r.chance(0.5); const ans=big?Math.max(x1,x2):Math.min(x1,x2); const D=p*p-4*q;
  return {text:'<p>Решите уравнение '+poly([[1,'x²'],[p,'x'],[q,'']])+' = 0. Если уравнение имеет более одного корня, в ответ запишите '+(big?'больший':'меньший')+' из корней.</p>', ans:fmt(ans), hint:'Найди дискриминант D = b² − 4ac или подбери корни по теореме Виета.',
    sol:'D = '+par(p)+'² − 4·'+par(q)+' = '+D+', √D = '+Math.sqrt(D)+'. x = '+frac('−'+par(p)+' ± '+Math.sqrt(D),'2')+': x₁ = '+fmt(Math.min(x1,x2))+', x₂ = '+fmt(Math.max(x1,x2))+'. По Виету: сумма '+fmt(x1+x2)+', произведение '+fmt(q)+'. Ответ: '+fmt(ans)+'.'};
});

// 10. Вероятность
L(10,'Теория вероятностей','prob',1,(r)=>{

  if(t===3){ const n=r.pick([2,3]); const k=n===2? r.pick([0,1,2]) : r.pick([0,1,2,3]); const C=[[1],[1,1],[1,2,1],[1,3,3,1]][n][k]; const tot=2**n; const word=['не выпадет ни разу','выпадет ровно один раз','выпадет ровно два раза','выпадет ровно три раза'][k];
    return {text:'<p>В случайном эксперименте симметричную монету бросают '+(n===2?'дважды':'трижды')+'. Найдите вероятность того, что орёл '+word+'.</p>', ans:fmt(C/tot), hint:'Выпиши все исходы: их '+tot+'.', sol:'Всего исходов 2'+(n===2?'²':'³')+' = '+tot+'. Подходящих — '+C+'. P = '+frac(C,tot)+' = '+fmt(C/tot)+'.'}; }

// 11. Графики функций
L(11,'Графики функций: соответствие','func',1,(r)=>{
  let items;
  if(r.chance(0.5)){
    const k1=r.sign()*r.pick([1,2,3]), b0=r.sign()*r.int(1,3), q=r.pick([2,4,6]), s3=r.sign(), sa=r.sign(), a=r.pick([0.5,1]);
    items=[
      {f:x=>k1*x+b0, lbl:'y = '+poly([[k1,'x'],[b0,'']]), hint:'прямая'},
      {f:x=>s3*q/x, lbl:'y = '+(s3<0?'−':'')+frac(q,'x'), hint:'гипербола, ветви во '+(s3>0?'I и III':'II и IV')+' четвертях'},
      {f:x=>sa*a*x*x, lbl:'y = '+(sa<0?'−':'')+(a===1?'':fmt(a))+'x²', hint:'парабола, ветви '+(sa>0?'вверх':'вниз')}
    ];
  } else {
    const combos=r.sample([[1,1],[1,-1],[-1,1],[-1,-1]],3);
    items=combos.map(([sk,sb])=>{ const kk=sk*r.pick([0.5,1,2]), bb=sb*r.pick([1,2,3]); return {f:x=>kk*x+bb, lbl:'y = '+poly([[kk,'x'],[bb,'']]), hint:'k '+(sk>0?'&gt;':'&lt;')+' 0, b '+(sb>0?'&gt;':'&lt;')+' 0'}; });
  }
  const order=r.shuffle([0,1,2]); // графики А,Б,В -> items[order[i]]
  const fnums=r.shuffle([0,1,2]); // формулы 1,2,3 -> items[fnums[j]]
  const ans=order.map(i=>fnums.indexOf(i)+1).join('');
  const graphs=order.map((i,j)=>'<figure class="gcell"><figcaption>'+'АБВ'[j]+')</figcaption>'+axesFn([items[i].f],'График '+'АБВ'[j])+'</figure>').join('');
  return {text:'<p>Установите соответствие между графиками функций и формулами, которые их задают.</p><div class="graphs">'+graphs+'</div><p>Формулы: '+fnums.map((i,j)=>(j+1)+') '+items[i].lbl).join('&nbsp;&nbsp;&nbsp; ')+'</p><p>В ответ запишите цифры для А, Б, В без пробелов.</p>',
    kind:'seq', ans, hint:'Прямая: знак k — наклон (растёт или убывает), b — точка пересечения с осью y. Гипербола k/x: при k &gt; 0 ветви в I и III четвертях. Парабола ax²: при a &gt; 0 ветви вверх.',
    sol:order.map((i,j)=>'АБВ'[j]+' — '+items[i].lbl+(items[i].hint?' ('+items[i].hint+')':'')).join('; ')+'. Ответ: '+ans+'.'};
});

// 12. Формулы
L(12,'Расчёты по формулам','formula',1,(r)=>{
  const t=r.int(0,4);
  if(t===0){ const tc=r.int(-6,8)*5; const tf=1.8*tc+32; if(r.chance(0.5)) return {text:'<p>Перевести значение температуры по шкале Цельсия в шкалу Фаренгейта позволяет формула t<sub>F</sub> = 1,8t<sub>C</sub> + 32. Сколько градусов по шкале Фаренгейта соответствует '+fmt(tc)+'° по шкале Цельсия?</p>', ans:fmt(tf), hint:'Подставь t_C в формулу.', sol:'t<sub>F</sub> = 1,8 · '+par(tc)+' + 32 = '+fmt(1.8*tc)+' + 32 = '+fmt(tf)+'.'};
    return {text:'<p>Перевести значение температуры по шкале Цельсия в шкалу Фаренгейта позволяет формула t<sub>F</sub> = 1,8t<sub>C</sub> + 32. Сколько градусов по шкале Цельсия соответствует '+fmt(tf)+'° по шкале Фаренгейта?</p>', ans:fmt(tc), hint:'Подставь t_F и реши линейное уравнение.', sol:fmt(tf)+' = 1,8t<sub>C</sub> + 32 → 1,8t<sub>C</sub> = '+fmt(tf-32)+' → t<sub>C</sub> = '+fmt(tc)+'.'}; }
  if(t===1){ const I=r.int(2,9), R=r.int(3,20); const P=I*I*R; return {text:'<p>Мощность постоянного тока (в ваттах) вычисляется по формуле P = I²R, где I — сила тока (в амперах), R — сопротивление (в омах). Пользуясь этой формулой, найдите сопротивление R, если мощность составляет '+P+' Вт, а сила тока равна '+I+' А.</p>', ans:fmt(R), hint:'Вырази R = P / I².', sol:'R = '+frac(P,I+'²')+' = '+frac(P,I*I)+' = '+R+' Ом.'}; }
  if(t===2){ const a=r.int(3,20), h=r.int(2,15); const S=a*h/2; return {text:'<p>Площадь треугольника можно вычислить по формуле S = '+frac('ah','2')+', где a — сторона, h — высота, проведённая к этой стороне. Пользуясь формулой, найдите высоту h, если a = '+a+', S = '+fmt(S)+'.</p>', ans:fmt(h), hint:'h = 2S / a.', sol:'h = '+frac('2S','a')+' = '+frac('2 · '+fmt(S),a)+' = '+h+'.'}; }
  if(t===3){ const base=r.pick([150,200,250]), m=r.int(4,7), rate=r.int(9,16), tt=r.int(m+1,m+25); const C=base+rate*(tt-m);
    return {text:'<p>Стоимость поездки на такси (в рублях) рассчитывается по формуле C = '+base+' + '+rate+'(t − '+m+'), где t — длительность поездки в минутах (t &gt; '+m+'). Пользуясь этой формулой, рассчитайте стоимость '+tt+'-минутной поездки.</p>', ans:fmt(C), hint:'Подставь t в формулу, сначала скобки.', sol:'C = '+base+' + '+rate+' · ('+tt+' − '+m+') = '+base+' + '+rate+' · '+(tt-m)+' = '+C+' руб.'}; }
  const w=r.int(2,9), R=r.pick([0.5,1,1.5,2,2.5,3,4]); const a=w*w*R;
  return {text:'<p>Центростремительное ускорение при движении по окружности (в м/с²) вычисляется по формуле a = ω²R, где ω — угловая скорость (в с⁻¹), R — радиус окружности (в метрах). Пользуясь этой формулой, найдите радиус R, если угловая скорость равна '+w+' с⁻¹, а ускорение равно '+fmt(a)+' м/с².</p>', ans:fmt(R), hint:'R = a / ω².', sol:'R = '+frac(fmt(a),w+'²')+' = '+frac(fmt(a),w*w)+' = '+fmt(R)+' м.'};
});

// 13. Неравенства
L(13,'Неравенства','ineq',1,(r)=>{
  if(r.chance(0.55)){ let a,c,x0,b,d; do{ a=r.int(-8,8); c=r.int(-8,8); x0=r.int(-7,7); b=r.int(-12,12); }while(a===c||a===0||x0===0); d=(a-c)*x0+b;
    const ge=r.chance(0.5); const kk=a-c; // kx ≥ kx0
    const dirGe = (kk>0)===ge; const iv=(v,g)=> g? '['+fmt(v)+'; +∞)' : '(−∞; '+fmt(v)+']';
    const correct=iv(x0,dirGe); const wrong=[iv(x0,!dirGe), iv(-x0,dirGe), iv(-x0,!dirGe)];
    const opts=r.shuffle([correct].concat(wrong)); const k=opts.indexOf(correct)+1;
    return {text:'<p>Укажите решение неравенства '+poly([[a,'x'],[b,'']])+' '+(ge?'≥':'≤')+' '+poly([[c,'x'],[d,'']])+'.</p><p>'+opts.map((o,i)=>(i+1)+') '+o).join('&nbsp;&nbsp;&nbsp; ')+'</p>', ans:String(k),
      hint:'При делении обеих частей на отрицательное число знак неравенства меняется на противоположный.',
      sol:poly([[kk,'x']])+' '+(ge?'≥':'≤')+' '+fmt(d-b)+'. Делим на '+par(kk)+(kk<0?' (отрицательное, знак меняется)':'')+': x '+(dirGe?'≥':'≤')+' '+fmt(x0)+'. Это '+correct+', вариант '+k+'.'}; }
  const m=r.int(1,9), less=r.chance(0.5); const correct= less? '(−'+m+'; '+m+')' : '(−∞; −'+m+') ∪ ('+m+'; +∞)';
  const wrong= less? ['(−∞; −'+m+') ∪ ('+m+'; +∞)','(−∞; '+m+')','('+m+'; +∞)'] : ['(−'+m+'; '+m+')','('+m+'; +∞)','(−∞; −'+m+')'];
  const opts=r.shuffle([correct].concat(wrong)); const k=opts.indexOf(correct)+1;
  return {text:'<p>Укажите решение неравенства x² − '+(m*m)+' '+(less?'&lt;':'&gt;')+' 0.</p><p>'+opts.map((o,i)=>(i+1)+') '+o).join('&nbsp;&nbsp;&nbsp; ')+'</p>', ans:String(k),
    hint:'Корни x² − '+(m*m)+' = 0: x = ±'+m+'. Ветви параболы направлены вверх.', sol:'Парабола y = x² − '+(m*m)+' пересекает ось x в точках ±'+m+' и '+(less?'ниже оси между корнями':'выше оси вне отрезка между корнями')+'. Решение: '+correct+', вариант '+k+'.'};
});

L(14,'Прогрессии в задачах','prog',1,(r)=>{

  if(t===1){ const a1=r.pick([5,4.9]), d=a1*2, n=r.int(3,7); const S=n*(2*a1+(n-1)*d)/2; return {text:'<p>При свободном падении тело прошло в первую секунду '+fmt(a1)+' м, а в каждую следующую на '+fmt(d)+' м больше, чем в предыдущую. Найдите расстояние (в метрах), пройденное телом за первые '+n+' секунд.</p>', ans:fmt(S), hint:'Sₙ = (2a₁ + (n − 1)d) · n / 2.', sol:'S = '+frac('(2 · '+fmt(a1)+' + '+(n-1)+' · '+fmt(d)+') · '+n,'2')+' = '+fmt(S)+' м.'}; }
  if(t===2){ const b1=r.int(1,5)*10, h=r.pick([2,3]), k=r.int(3,6); const bn=b1*h**k; return {text:'<p>Колония бактерий каждые 20 минут увеличивается в '+h+' раза. Сейчас в колонии '+b1+' бактерий. Сколько бактерий будет в колонии через '+(k*20)+' минут?</p>', ans:fmt(bn), hint:'Это геометрическая прогрессия: за каждые 20 минут умножаем на '+h+'.', sol:'За '+(k*20)+' минут — '+k+' увеличений: '+b1+' · '+h+'<sup>'+k+'</sup> = '+b1+' · '+(h**k)+' = '+bn+'.'}; }
  const a1=r.pick([10,15,20]), d=r.pick([5,10,15]), n=r.int(5,12); const an=a1+(n-1)*d; const hh=Math.floor(an/60), mm=an%60;
  return {text:'<p>Врач прописал пациенту курс воздушных ванн: в первый день '+a1+' минут, а в каждый следующий день увеличивать время на '+d+' минут. В какой по счёту день продолжительность процедуры достигнет '+(hh? hh+' ч ':'')+(mm? mm+' мин':'')+'?</p>', ans:fmt(n), hint:'Переведи время в минуты и реши a₁ + (n − 1)d = aₙ.', sol:an+' = '+a1+' + (n − 1) · '+d+' → n − 1 = '+((an-a1)/d)+' → n = '+n+'.'};
});

// 15. Треугольники
L(15,'Треугольники','tri',1,(r)=>{

  if(t===3){ const A=r.int(10,40)*2, B=r.int(20,70); if(A+B>=170) return {text:'<p>В треугольнике ABC угол A равен 60°, угол B равен 50°, AD — биссектриса. Найдите угол ADB.</p>'+triSvg(P,['A','B','C']), ans:'100', hint:'Найди половину угла A и примени сумму углов треугольника ABD.', sol:'∠BAD = 30°, ∠ADB = 180° − 50° − 30° = 100°.'};
    return {text:'<p>В треугольнике ABC угол A равен '+A+'°, угол B равен '+B+'°, AD — биссектриса угла A (D лежит на BC). Найдите угол ADB. Ответ дайте в градусах.</p>'+triSvg(P,['A','B','C']), ans:fmt(180-B-A/2), hint:'Биссектриса делит угол пополам. Рассмотри треугольник ABD.', sol:'∠BAD = '+A+'° : 2 = '+(A/2)+'°. В треугольнике ABD: ∠ADB = 180° − '+B+'° − '+(A/2)+'° = '+(180-B-A/2)+'°.'}; }
  const AC=r.int(4,30)*2; return {text:'<p>В треугольнике ABC сторона AC равна '+AC+'. Точки M и N — середины сторон AB и BC соответственно. Найдите длину отрезка MN.</p>'+triSvg(P,['A','C','B']), ans:fmt(AC/2), hint:'MN — средняя линия треугольника.', sol:'MN — средняя линия, параллельная AC, она равна половине AC: '+AC+' : 2 = '+(AC/2)+'.'};

// 16. Окружность
L(16,'Окружность и углы','circ',1,(r)=>{
  const t=r.int(0,4);
  if(t===0){ const x=r.int(15,80); return {text:'<p>Точка O — центр окружности, на которой лежат точки A, B и C. Известно, что ∠AOB = '+(2*x)+'°. Найдите угол ACB. Ответ дайте в градусах.</p>'+circleSvg([['A',200],['B',-20],['C',90]],{center:true,segs:[['O','A'],['O','B'],['C','A'],['C','B']]}), ans:fmt(x), hint:'Вписанный угол равен половине центрального, опирающегося на ту же дугу.', sol:'∠ACB = ½ · ∠AOB = ½ · '+(2*x)+'° = '+x+'°.'}; }
  if(t===1){ const a=r.int(15,75); return {text:'<p>AB — диаметр окружности, точка C лежит на окружности. Угол BAC равен '+a+'°. Найдите угол ABC. Ответ дайте в градусах.</p>'+circleSvg([['A',180],['B',0],['C',110]],{segs:[['A','B'],['A','C'],['C','B']]}), ans:fmt(90-a), hint:'Вписанный угол, опирающийся на диаметр, — прямой.', sol:'∠ACB = 90°, поэтому ∠ABC = 90° − '+a+'° = '+(90-a)+'°.'}; }
  if(t===2){ const [p,q,s]=r.pick(TRIPLES); return {text:'<p>Из точки A проведена касательная к окружности с центром O, B — точка касания. Радиус окружности равен '+p+', AO = '+s+'. Найдите AB.</p>', ans:fmt(q), hint:'Радиус в точку касания перпендикулярен касательной: треугольник ABO прямоугольный.', sol:'∠ABO = 90°. AB = '+rad(s+'² − '+p+'²')+' = '+rad(s*s-p*p)+' = '+q+'.'}; }
  if(t===3){ const a=r.int(50,130); return {text:'<p>Четырёхугольник ABCD вписан в окружность. Угол ABC равен '+a+'°. Найдите угол ADC. Ответ дайте в градусах.</p>'+circleSvg([['A',200],['B',110],['C',20],['D',-80]],{segs:[['A','B'],['B','C'],['C','D'],['D','A']]}), ans:fmt(180-a), hint:'Сумма противоположных углов вписанного четырёхугольника равна 180°.', sol:'∠ADC = 180° − '+a+'° = '+(180-a)+'°.'}; }
  const [a,b,c]=r.pick(TRIPLES); return {text:'<p>Катеты прямоугольного треугольника равны '+a+' и '+b+'. Найдите радиус окружности, описанной около этого треугольника.</p>', ans:fmt(c/2), hint:'Центр описанной окружности — середина гипотенузы.', sol:'Гипотенуза: '+rad(a+'² + '+b+'²')+' = '+c+'. R = '+c+' : 2 = '+fmt(c/2)+'.'};
});

// 17. Четырёхугольники

  const para=svg(260,150,OGE.poly2([[30,125],[190,125],[235,30],[75,30]])+text(20,140,'A','t-ink t-it')+text(196,140,'D','t-ink t-it')+text(243,30,'C','t-ink t-it')+text(66,26,'B','t-ink t-it'),'Параллелограмм ABCD');
  if(t===0){ const a=r.int(20,85); return {text:'<p>Один из углов параллелограмма равен '+a+'°. Найдите больший угол этого параллелограмма. Ответ дайте в градусах.</p>'+para, ans:fmt(Math.max(a,180-a)), hint:'Соседние углы параллелограмма в сумме дают 180°.', sol:'Соседний угол: 180° − '+a+'° = '+(180-a)+'°. Больший: '+Math.max(a,180-a)+'°.'}; }
  if(t===1){ const d1=r.int(3,20), d2=r.int(3,20)*2; return {text:'<p>Диагонали ромба равны '+d1+' и '+d2+'. Найдите его площадь.</p>', ans:fmt(d1*d2/2), hint:'S = d₁ · d₂ / 2.', sol:'S = '+frac(d1+' · '+d2,'2')+' = '+fmt(d1*d2/2)+'.'}; }
  if(t===2){ const a=r.int(2,12), b=a+r.int(2,14), h=r.int(2,12); return {text:'<p>Основания трапеции равны '+a+' и '+b+', а высота равна '+h+'. Найдите площадь трапеции.</p>'+svg(260,130,OGE.poly2([[20,110],[240,110],[180,25],[70,25]])+'<line x1="70" y1="25" x2="70" y2="110" class="s-dash"/>','Трапеция'), ans:fmt((a+b)*h/2), hint:'S = (a + b) / 2 · h.', sol:'S = '+frac(a+' + '+b,'2')+' · '+h+' = '+fmt((a+b)/2)+' · '+h+' = '+fmt((a+b)*h/2)+'.'}; }
  if(t===3){ const [p,q,s]=r.pick(TRIPLES); return {text:'<p>Сторона прямоугольника равна '+p+', а диагональ равна '+s+'. Найдите площадь прямоугольника.</p>', ans:fmt(p*q), hint:'Вторую сторону найди по теореме Пифагора.', sol:'Вторая сторона: '+rad(s+'² − '+p+'²')+' = '+q+'. S = '+p+' · '+q+' = '+(p*q)+'.'}; }
  const a=r.int(2,10), b=a+2*r.int(1,6); const h=(b-a)/2; return {text:'<p>В равнобедренной трапеции основания равны '+a+' и '+b+', а острый угол равен 45°. Найдите площадь трапеции.</p>', ans:fmt((a+b)/2*h), hint:'Опусти высоту из конца меньшего основания: получится равнобедренный прямоугольный треугольник.', sol:'Отрезок большего основания у угла: ('+b+' − '+a+') : 2 = '+h+'. При угле 45° высота равна этому отрезку: h = '+h+'. S = '+frac(a+' + '+b,'2')+' · '+h+' = '+fmt((a+b)/2*h)+'.'};
});

// 18. Клетчатая бумага
L(18,'Фигуры на клетчатой бумаге','grid',1,(r)=>{
  const t=r.int(0,2);
  if(t===0){ const x1=r.int(1,3), len=r.int(3,7), y=r.int(6,7), apx=r.int(1,9), apy=r.int(1,y-2); const pts=[[x1,y],[x1+len,y],[apx,apy]]; const h=y-apy; const S=len*h/2;
    return {text:'<p>На клетчатой бумаге с размером клетки 1 × 1 изображён треугольник. Найдите его площадь.</p>'+gridSvg(10,8,(c,p)=>OGE.poly2(pts.map(q=>[p+q[0]*c,p+q[1]*c]),'s-ink f-soft')), ans:fmt(S), hint:'Основание лежит на линии сетки — посчитай его длину и высоту в клетках.', sol:'Основание = '+len+', высота = '+h+'. S = ½ · '+len+' · '+h+' = '+fmt(S)+'.'}; }
  if(t===1){ const y1=r.int(1,3), y2=r.int(6,7), b1=r.int(2,4), x1=r.int(1,4), B=b1+r.int(2,5), X=r.int(0,2); const pts=[[X,y2],[X+B,y2],[x1+b1,y1],[x1,y1]]; const ml=(b1+B)/2;
    const ask=r.chance(0.5);
    return {text:'<p>На клетчатой бумаге с размером клетки 1 × 1 изображена трапеция. Найдите '+(ask?'длину её средней линии':'её площадь')+'.</p>'+gridSvg(10,8,(c,p)=>OGE.poly2(pts.map(q=>[p+q[0]*c,p+q[1]*c]),'s-ink f-soft')), ans:fmt(ask?ml:ml*(y2-y1)),
      hint:'Основания трапеции лежат на горизонтальных линиях сетки. Средняя линия — полусумма оснований.', sol:'Основания: '+b1+' и '+B+'. Средняя линия: ('+b1+' + '+B+') : 2 = '+fmt(ml)+'.'+(ask?'':' Высота: '+(y2-y1)+'. S = '+fmt(ml)+' · '+(y2-y1)+' = '+fmt(ml*(y2-y1))+'.')}; }
  const [dx,dy]=r.pick([[3,4],[4,3],[8,6],[6,8]].filter(t=>t[1]<=7)); const x0=r.int(0,9-dx), y0=r.int(0,7-dy); const pA=[x0,y0+dy], pB=[x0+dx,y0]; const len=Math.hypot(dx,dy);
  return {text:'<p>На клетчатой бумаге с размером клетки 1 × 1 отмечены точки A и B. Найдите длину отрезка AB.</p>'+gridSvg(10,8,(c,p)=>line(p+pA[0]*c,p+pA[1]*c,p+pB[0]*c,p+pB[1]*c,'s-fn')+dot(p+pA[0]*c,p+pA[1]*c)+dot(p+pB[0]*c,p+pB[1]*c)+text(p+pA[0]*c+12,p+pA[1]*c-4,'A','t-ink t-it')+text(p+pB[0]*c-12,p+pB[1]*c+16,'B','t-ink t-it')), ans:fmt(len), hint:'Дострой прямоугольный треугольник по линиям сетки и примени теорему Пифагора.', sol:'Катеты: '+dx+' и '+dy+'. AB = '+rad(dx+'² + '+dy+'²')+' = '+rad(dx*dx+dy*dy)+' = '+fmt(len)+'.'};
});

// 19. Верные утверждения
L(19,'Верные утверждения','facts',1,(r)=>{

    hint:'Вспомни свойства фигур. Если сомневаешься — нарисуй контрпример.', sol:opts.map((o,i)=>(i+1)+') '+(o[1]?'<b>верно</b>':'неверно')).join('; ')+'. Ответ: '+ans+'.'};

// 20. Уравнения (2 балла)
L(20,'Уравнения повышенной сложности','eq',2,(r)=>{
  if(r.chance(0.5)){ let a,b; do{ a=r.int(1,5); b=r.int(1,6);}while(a===b); const s=a*a+b*b, p=a*a*b*b; const roots=[-Math.max(a,b),-Math.min(a,b),Math.min(a,b),Math.max(a,b)];
    return {text:'<p>Решите уравнение x⁴ − '+s+'x² + '+p+' = 0.</p><p class="note">Запишите все корни через точку с запятой, например: −1; 2.</p>', kind:'numset', ans:roots.map(fmt).join('; '),
      hint:'Сделай замену t = x² (t ≥ 0) и реши квадратное уравнение.', sol:'Замена t = x²: t² − '+s+'t + '+p+' = 0. По Виету t₁ = '+(a*a)+', t₂ = '+(b*b)+'. Тогда x² = '+(a*a)+' → x = ±'+a+'; x² = '+(b*b)+' → x = ±'+b+'. Ответ: '+roots.map(fmt).join('; ')+'.'}; }
  let p,a; do{ p=r.int(-6,6); a=r.int(1,5);}while(Math.abs(p)<2||Math.abs(p)===a); const A=a*a; const roots=[-p,-a,a].sort((x,y)=>x-y);
  return {text:'<p>Решите уравнение '+poly([[1,'x³'],[p,'x²'],[-A,'x'],[-p*A,'']])+' = 0.</p><p class="note">Запишите все корни через точку с запятой.</p>', kind:'numset', ans:roots.map(fmt).join('; '),
    hint:'Сгруппируй: x²(x '+(p>0?'+':'−')+' '+Math.abs(p)+') − '+A+'(x '+(p>0?'+':'−')+' '+Math.abs(p)+').',
    sol:'x²(x '+(p>0?'+ ':'− ')+Math.abs(p)+') − '+A+'(x '+(p>0?'+ ':'− ')+Math.abs(p)+') = 0 → (x '+(p>0?'+ ':'− ')+Math.abs(p)+')(x² − '+A+') = 0. Отсюда x = '+fmt(-p)+' или x = ±'+a+'. Ответ: '+roots.map(fmt).join('; ')+'.'};
});

// 21. Текстовая задача (2 балла)
L(21,'Текстовые задачи','text',2,(r)=>{
  if(r.chance(0.5)){ let v,c,t,d; do{ c=r.int(1,4); v=r.int(c+5,25); t=r.int(1,6); d=t*(v*v-c*c)/(2*c);}while(!Number.isInteger(d)||d>400||d<20);
    return {text:'<p>Моторная лодка прошла против течения реки '+d+' км и вернулась в пункт отправления, затратив на обратный путь на '+t+' ч меньше. Найдите скорость лодки в неподвижной воде, если скорость течения равна '+c+' км/ч. Ответ дайте в км/ч.</p>', ans:fmt(v),
      hint:'Пусть x — скорость лодки. Против течения x − '+c+', по течению x + '+c+'. Время = расстояние / скорость.',
      sol:'Пусть x км/ч — скорость лодки. '+frac(d,'x − '+c)+' − '+frac(d,'x + '+c)+' = '+t+'. Приводим к общему знаменателю: '+d+'·'+(2*c)+' = '+t+'(x² − '+(c*c)+'), откуда x² = '+(v*v)+', x = '+v+' (скорость положительна). Ответ: '+v+' км/ч.'}; }
  let x,k,t,V; do{ x=r.int(4,30); k=r.int(1,6); t=r.int(1,10); V=t*x*(x+k)/k; }while(!Number.isInteger(V)||V>800);
  return {text:'<p>Первая труба пропускает на '+k+' литр'+(k===1?'':k<5?'а':'ов')+' воды в минуту меньше, чем вторая. Сколько литров воды в минуту пропускает первая труба, если резервуар объёмом '+V+' литров она заполняет на '+t+' минут'+(t===1?'у':t<5?'ы':'')+' дольше, чем вторая труба?</p>', ans:fmt(x),
    hint:'Пусть x л/мин — первая труба, тогда вторая x + '+k+'. Составь уравнение по времени.',
    sol:frac(V,'x')+' − '+frac(V,'x + '+k)+' = '+t+' → '+V+'·'+k+' = '+t+'x(x + '+k+') → '+t+'x² + '+(t*k)+'x − '+(V*k)+' = 0. Положительный корень x = '+x+'. Ответ: '+x+'.'};
});

// 22. График (2 балла)
L(22,'Построение графиков с модулем','func',2,(r)=>{
  let a,b,up,s; do{ a=r.int(1,3); b=r.int(-3,4); up=r.chance(0.6); s=up?1:-1; }while(Math.abs(b-s*a*a)>5); // y = s(x² − 2a|x|) + b
  const f=x=>s*(x*x-2*a*Math.abs(x))+b; const ext=b-s*a*a;
  const formula='y = '+(up? 'x² − '+(2*a)+'|x|' : '−x² + '+(2*a)+'|x|')+(b? (b>0?' + ':' − ')+Math.abs(b):'');
  return {text:'<p>Постройте график функции '+formula+'. Определите, при каких значениях m прямая y = m имеет с графиком ровно три общие точки.</p>', ans:fmt(b),
    hint:'Построй параболу для x ≥ 0 и отрази её симметрично относительно оси y. Посмотри, через какую точку проходит горизонтальная прямая, чтобы пересечений было три.',
    sol:'При x ≥ 0: '+(up?'y = x² − '+(2*a)+'x':'y = −x² + '+(2*a)+'x')+(b?(b>0?' + ':' − ')+Math.abs(b):'')+' — парабола с вершиной ('+a+'; '+fmt(ext)+'). График чётный: левая часть симметрична правой. Получается «'+(up?'W':'M')+'»: две вершины на высоте '+fmt(ext)+' и точка (0; '+fmt(b)+') в середине. Прямая y = m имеет три общие точки, когда проходит через точку (0; '+fmt(b)+'): m = '+fmt(b)+'.'+axesFn([f],'График '+formula)};
});

// 23. Геометрия (2 балла)
L(23,'Геометрическая задача на вычисление','geo2',2,(r)=>{
  const t=r.int(0,3);
  if(t===0){ let tr; do{ tr=r.pick(TRIPLES);}while(!new Fr(tr[0]*tr[1],tr[2]).finite()); const [a,b,c]=tr; const h=a*b/c;
    return {text:'<p>Катеты прямоугольного треугольника равны '+a+' и '+b+'. Найдите высоту, проведённую к гипотенузе.</p>', ans:fmt(h), hint:'Площадь можно записать двумя способами: ½·a·b и ½·c·h.', sol:'c = '+rad(a+'² + '+b+'²')+' = '+c+'. Из ½·a·b = ½·c·h получаем h = '+frac(a+' · '+b,c)+' = '+fmt(h)+'.'}; }
  if(t===1){ const [p,q,s]=r.pick(TRIPLES); const a=r.int(2,10); const b=a+2*p; return {text:'<p>Основания равнобедренной трапеции равны '+a+' и '+b+', боковая сторона равна '+s+'. Найдите высоту трапеции.</p>', ans:fmt(q), hint:'Опусти высоту: отрезок большего основания у угла равен (b − a) / 2.', sol:'('+b+' − '+a+') : 2 = '+p+'. h = '+rad(s+'² − '+p+'²')+' = '+q+'.'}; }
  if(t===2){ let tr; do{ tr=r.pick(TRIPLES);}while(!new Fr(2*tr[0]*tr[1],tr[2]).finite()); const [p,q,s]=tr; const d1=2*p, d2=2*q; const h=d1*d2/(2*s);
    return {text:'<p>Диагонали ромба равны '+d1+' и '+d2+'. Найдите высоту ромба.</p>', ans:fmt(h), hint:'Диагонали ромба перпендикулярны и делятся пополам. Найди сторону, затем высоту через площадь.', sol:'Половины диагоналей '+p+' и '+q+', сторона '+rad(p+'² + '+q+'²')+' = '+s+'. S = '+frac(d1+' · '+d2,2)+' = '+(d1*d2/2)+'. h = S : a = '+(d1*d2/2)+' : '+s+' = '+fmt(h)+'.'}; }
  const AB=r.int(6,30), BM=r.int(2,AB-2), AC=r.int(4,40); const MN=AC*BM/AB; if(!new Fr(AC*BM,AB).finite()) return {text:'<p>Прямая, параллельная стороне AC треугольника ABC, пересекает стороны AB и BC в точках M и N соответственно. AB = 20, AC = 15, BM = 8. Найдите MN.</p>', ans:'6', hint:'Треугольники MBN и ABC подобны.', sol:'MN/AC = BM/AB = 8/20; MN = 15 · 8 / 20 = 6.'};
  return {text:'<p>Прямая, параллельная стороне AC треугольника ABC, пересекает стороны AB и BC в точках M и N соответственно. AB = '+AB+', AC = '+AC+', BM = '+BM+'. Найдите MN.</p>', ans:fmt(MN), hint:'Треугольники MBN и ABC подобны по двум углам.', sol:'Треугольники MBN и ABC подобны: '+frac('MN','AC')+' = '+frac('BM','AB')+'. MN = '+frac(AC+' · '+BM,AB)+' = '+fmt(MN)+'.'};
});

// 24. Доказательство (2 балла, самопроверка)

// 25. Сложная геометрия
L(25,'Геометрическая задача повышенной сложности','geo2',2,(r)=>{
  const t=r.int(0,2);
  if(t===0){ const p=r.int(1,7), q=r.int(p+1,10); return {text:'<p>Диагонали AC и BD трапеции ABCD с основаниями BC и AD пересекаются в точке O. Площади треугольников BOC и AOD равны '+(p*p)+' и '+(q*q)+'. Найдите площадь трапеции.</p>', ans:fmt((p+q)**2),
